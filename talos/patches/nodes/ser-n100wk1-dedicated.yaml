# Dedicated NVR node: only workloads tolerating dedicated=nvr:NoSchedule
# (i.e. Frigate) plus system DaemonSets may schedule here.
# The Longhorn label keeps Longhorn from creating a default disk on this node,
# so its local disk and I/O stay free for Frigate.
machine:
  nodeLabels:
    homme.ar/role: nvr
    node.longhorn.io/create-default-disk: "false"
  nodeTaints:
    dedicated: "nvr:NoSchedule"
  # The control-plane patch sets this for the MS-A2 nodes; the worker needs it
  # too, otherwise its self-signed kubelet serving cert lacks the node IP SAN
  # and metrics-server refuses to scrape it (x509 IP SAN error).
  kubelet:
    extraArgs:
      rotate-server-certificates: "true"
