apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
  namespace: renovate
spec:
  interval: 30m
  chart:
    spec:
      chart: renovate
      version: "46.*"
      sourceRef:
        kind: HelmRepository
        name: renovate
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    cronjob:
      schedule: "17 * * * *"
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 3
      jobBackoffLimit: 1
      # Renovate no longer accepts App ID + private key directly; it requires a
      # GitHub App installation token (RENOVATE_TOKEN). Mint one at job start:
      # sign a JWT with the App private key and exchange it for an installation
      # token (valid for 1h, so it must be generated on every run).
      preCommand: |
        b64url() { openssl base64 -e -A | tr '+/' '-_' | tr -d '='; }
        now=$(date +%s)
        jwt_header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
        jwt_payload=$(printf '{"iat":%d,"exp":%d,"iss":%s}' $((now - 60)) $((now + 540)) "$RENOVATE_APP_ID" | b64url)
        jwt_signature=$(printf '%s.%s' "$jwt_header" "$jwt_payload" | openssl dgst -sha256 -sign "$RENOVATE_PRIVATE_KEY_PATH" -binary | b64url)
        jwt="$jwt_header.$jwt_payload.$jwt_signature"
        installation_id=$(curl -sf -H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json" https://api.github.com/app/installations | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
        export RENOVATE_TOKEN=$(curl -sf -X POST -H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json" "https://api.github.com/app/installations/$installation_id/access_tokens" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
        echo "Minted GitHub App installation token for installation $installation_id"
    renovate:
      configIsJavaScript: true
      config: |
        module.exports = {
          platform: 'github',
          repositories: ['homme-ar/infra'],
          onboarding: false,
          requireConfig: 'ignored',
          prHourlyLimit: 5,
          prConcurrentLimit: 10,
          labels: ['dependencies'],
        };
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
    # All keys of this secret are injected as environment variables
    # (RENOVATE_APP_ID, RENOVATE_PRIVATE_KEY_PATH).
    existingSecret: renovate-github-app
    env:
      LOG_LEVEL: info
    extraVolumes:
      - name: github-app-key
        secret:
          secretName: renovate-github-app
          defaultMode: 0444
          items:
            - key: app-private-key.pem
              path: app-private-key.pem
    extraVolumeMounts:
      - name: github-app-key
        mountPath: /secrets
        readOnly: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
