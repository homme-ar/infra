apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
  namespace: renovate
spec:
  interval: 30m
  chart:
    spec:
      chart: renovate
      version: "46.*"
      sourceRef:
        kind: HelmRepository
        name: renovate
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    cronjob:
      schedule: "17 * * * *"
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 1
      jobBackoffLimit: 1
      # Copies the renovate-metrics binary into a shared volume so the main
      # container can pipe the structured Renovate logs through it.
      initContainers:
        - name: renovate-metrics
          image: ghcr.io/raffis/renovate-metrics:v0.0.15
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "cp /usr/bin/renovate-metrics /shared/renovate-metrics"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: renovate-metrics-bin
              mountPath: /shared
      # renovate-metrics parses the structured logs from stdout and pushes
      # prometheus metrics to the pushgateway (observability/pushgateway).
      # tee keeps the logs visible via kubectl logs; pipefail propagates a
      # Renovate failure as a failed Job.
      commandOverride: ["/bin/bash", "-c"]
      argsOverride:
        - |
          set -o pipefail;
          renovate | tee /dev/stderr | /shared/renovate-metrics push --prometheus=http://prometheus-pushgateway.observability:9091
    renovate:
      configIsJavaScript: true
      config: |
        module.exports = {
          platform: 'github',
          repositories: ['homme-ar/infra'],
          onboarding: false,
          requireConfig: 'ignored',
          // NOTE: temporarily unlimited to catch up on the backlog; set back to 5.
          prHourlyLimit: 0,
          prConcurrentLimit: 10,
          dependencyDashboard: true,
          labels: ['dependencies'],
          // Default managerFilePatterns of these managers only cover files
          // named helmrelease.yaml / kubernetes manifests in specific dirs;
          // this repo keeps Flux HelmReleases in release.yaml files under cluster/.
          flux: {
            managerFilePatterns: ['/cluster\\/.*\\.yaml$/'],
          },
          kubernetes: {
            managerFilePatterns: ['/cluster\\/.*\\.yaml$/'],
          },
          // One PR per project (leaf directory under cluster/), containing all
          // of its dependency updates. When adding a new app/component, add a
          // matching rule here.
          packageRules: [
            // GHCR (which backs lscr.io) keeps every tag ever published, including
            // an ancient '8.1.2135' tag that is actually Lidarr 0.8.1 from 2021.
            // Constrain lidarr to the current 3.x stable stream.
            { matchPackageNames: ['lscr.io/linuxserver/lidarr'], allowedVersions: '/^3\\./' },
            { matchFileNames: ['cluster/apps/ai/ollama/**'], groupName: 'ollama', groupSlug: 'ollama' },
            { matchFileNames: ['cluster/apps/iot/esphome/**'], groupName: 'esphome', groupSlug: 'esphome' },
            { matchFileNames: ['cluster/apps/iot/ha-mcp/**'], groupName: 'ha-mcp', groupSlug: 'ha-mcp' },
            { matchFileNames: ['cluster/apps/iot/home-assistant/**'], groupName: 'home-assistant', groupSlug: 'home-assistant' },
            { matchFileNames: ['cluster/apps/iot/mosquitto/**'], groupName: 'mosquitto', groupSlug: 'mosquitto' },
            { matchFileNames: ['cluster/apps/iot/zigbee2mqtt/**'], groupName: 'zigbee2mqtt', groupSlug: 'zigbee2mqtt' },
            { matchFileNames: ['cluster/apps/media/bazarr/**'], groupName: 'bazarr', groupSlug: 'bazarr' },
            { matchFileNames: ['cluster/apps/media/jellyfin/**'], groupName: 'jellyfin', groupSlug: 'jellyfin' },
            { matchFileNames: ['cluster/apps/media/lingarr/**'], groupName: 'lingarr', groupSlug: 'lingarr' },
            { matchFileNames: ['cluster/apps/media/maintainerr/**'], groupName: 'maintainerr', groupSlug: 'maintainerr' },
            { matchFileNames: ['cluster/apps/media/nntp-share/**'], groupName: 'nntp-share', groupSlug: 'nntp-share' },
            { matchFileNames: ['cluster/apps/media/seerr/**'], groupName: 'seerr', groupSlug: 'seerr' },
            { matchFileNames: ['cluster/apps/media/lidarr/**'], groupName: 'lidarr', groupSlug: 'lidarr' },
            { matchFileNames: ['cluster/apps/media/prowlarr/**'], groupName: 'prowlarr', groupSlug: 'prowlarr' },
            { matchFileNames: ['cluster/apps/media/radarr/**'], groupName: 'radarr', groupSlug: 'radarr' },
            { matchFileNames: ['cluster/apps/media/sabnzbd/**'], groupName: 'sabnzbd', groupSlug: 'sabnzbd' },
            { matchFileNames: ['cluster/apps/media/sonarr/**'], groupName: 'sonarr', groupSlug: 'sonarr' },
            { matchFileNames: ['cluster/apps/media/subarr/**'], groupName: 'subarr', groupSlug: 'subarr' },
            { matchFileNames: ['cluster/apps/media/subgen/**'], groupName: 'subgen', groupSlug: 'subgen' },
            { matchFileNames: ['cluster/apps/platform/authelia/**'], groupName: 'authelia', groupSlug: 'authelia' },
            { matchFileNames: ['cluster/apps/platform/headlamp/**'], groupName: 'headlamp', groupSlug: 'headlamp' },
            { matchFileNames: ['cluster/apps/platform/homepage/**'], groupName: 'homepage', groupSlug: 'homepage' },
            { matchFileNames: ['cluster/apps/platform/index/**'], groupName: 'index', groupSlug: 'index' },
            { matchFileNames: ['cluster/apps/platform/ittools/**'], groupName: 'ittools', groupSlug: 'ittools' },
            { matchFileNames: ['cluster/apps/platform/librespeed/**'], groupName: 'librespeed', groupSlug: 'librespeed' },
            { matchFileNames: ['cluster/apps/platform/n8n/**'], groupName: 'n8n', groupSlug: 'n8n' },
            { matchFileNames: ['cluster/apps/platform/ntfy/**'], groupName: 'ntfy', groupSlug: 'ntfy' },
            { matchFileNames: ['cluster/apps/platform/postgres/**'], groupName: 'postgres', groupSlug: 'postgres' },
            { matchFileNames: ['cluster/apps/platform/vaultwarden/**'], groupName: 'vaultwarden', groupSlug: 'vaultwarden' },
            { matchFileNames: ['cluster/apps/platform/waha/**'], groupName: 'waha', groupSlug: 'waha' },
            { matchFileNames: ['cluster/flux-system/**'], groupName: 'fluxcd', groupSlug: 'fluxcd' },
            { matchFileNames: ['cluster/infrastructure/etcd-backup/**'], groupName: 'etcd-backup', groupSlug: 'etcd-backup' },
            { matchFileNames: ['cluster/infrastructure/networking/cilium/**'], groupName: 'cilium', groupSlug: 'cilium' },
            { matchFileNames: ['cluster/infrastructure/networking/gateway/**'], groupName: 'gateway', groupSlug: 'gateway' },
            { matchFileNames: ['cluster/infrastructure/networking/wireguard/**'], groupName: 'wireguard', groupSlug: 'wireguard' },
            { matchFileNames: ['cluster/infrastructure/nvidia-device-plugin/**'], groupName: 'nvidia-device-plugin', groupSlug: 'nvidia-device-plugin' },
            { matchFileNames: ['cluster/infrastructure/observability/adguard-exporter/**'], groupName: 'adguard-exporter', groupSlug: 'adguard-exporter' },
            { matchFileNames: ['cluster/infrastructure/observability/dashboards/**'], groupName: 'dashboards', groupSlug: 'dashboards' },
            { matchFileNames: ['cluster/infrastructure/observability/dcgm-exporter/**'], groupName: 'dcgm-exporter', groupSlug: 'dcgm-exporter' },
            { matchFileNames: ['cluster/infrastructure/observability/gatus/**'], groupName: 'gatus', groupSlug: 'gatus' },
            { matchFileNames: ['cluster/infrastructure/observability/kube-prometheus-stack/**'], groupName: 'kube-prometheus-stack', groupSlug: 'kube-prometheus-stack' },
            { matchFileNames: ['cluster/infrastructure/observability/metrics-server/**'], groupName: 'metrics-server', groupSlug: 'metrics-server' },
            { matchFileNames: ['cluster/infrastructure/observability/node-feature-discovery/**'], groupName: 'node-feature-discovery', groupSlug: 'node-feature-discovery' },
            { matchFileNames: ['cluster/infrastructure/observability/pushgateway/**'], groupName: 'pushgateway', groupSlug: 'pushgateway' },
            { matchFileNames: ['cluster/infrastructure/observability/servicemonitors/**'], groupName: 'servicemonitors', groupSlug: 'servicemonitors' },
            { matchFileNames: ['cluster/infrastructure/renovate/**'], groupName: 'renovate', groupSlug: 'renovate' },
            { matchFileNames: ['cluster/infrastructure/security/cert-manager-config/**'], groupName: 'cert-manager-config', groupSlug: 'cert-manager-config' },
            { matchFileNames: ['cluster/infrastructure/security/cert-manager/**'], groupName: 'cert-manager', groupSlug: 'cert-manager' },
            { matchFileNames: ['cluster/infrastructure/security/kubelet-serving-cert-approver/**'], groupName: 'kubelet-serving-cert-approver', groupSlug: 'kubelet-serving-cert-approver' },
            { matchFileNames: ['cluster/infrastructure/security/reloader/**'], groupName: 'reloader', groupSlug: 'reloader' },
            { matchFileNames: ['cluster/infrastructure/storage/cloudnativepg/**'], groupName: 'cloudnativepg', groupSlug: 'cloudnativepg' },
            { matchFileNames: ['cluster/infrastructure/storage/longhorn/**'], groupName: 'longhorn', groupSlug: 'longhorn' },
            { matchFileNames: ['cluster/infrastructure/storage/versitygw/**'], groupName: 'versitygw', groupSlug: 'versitygw' },
          ],
        };
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      # Makes the shared renovate-metrics-bin emptyDir writable by the
      # initContainer (which also runs as uid 1000).
      fsGroup: 1000
    # All keys of this secret are injected as environment variables (RENOVATE_TOKEN).
    existingSecret: renovate-github-token
    env:
      # renovate-metrics requires the structured debug logs to extract metrics.
      LOG_LEVEL: debug
      LOG_FORMAT: json
    extraVolumes:
      - name: renovate-metrics-bin
        emptyDir: {}
    extraVolumeMounts:
      - name: renovate-metrics-bin
        mountPath: /shared
        readOnly: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
