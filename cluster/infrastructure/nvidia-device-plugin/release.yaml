apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: nvidia-device-plugin
spec:
  interval: 30m
  chart:
    spec:
      chart: nvidia-device-plugin
      version: "0.19.*"
      sourceRef:
        kind: HelmRepository
        name: nvidia-device-plugin
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Time-slicing: advertise 10 logical replicas of the single physical GPU so
    # multiple pods (jellyfin transcoding, future subgen/whisper, ...) share it.
    # No VRAM isolation between pods (12GB total on the RTX A2000); MIG is not
    # supported on this card.
    config:
      map:
        default: |-
          version: v1
          sharing:
            timeSlicing:
              resources:
                - name: nvidia.com/gpu
                  replicas: 10
      default: default
    # Run with the nvidia runtime handler (registered by the siderolabs
    # nvidia-container-toolkit extension) so the driver libs (libnvidia-ml)
    # are injected into the plugin container.
    runtimeClassName: nvidia
    # Only ser-msa2cp1 has a GPU (label set by the Talos machine patch).
    nodeSelector:
      nvidia.com/gpu.present: "true"
    # The GPU node is a control plane, so the DaemonSet must tolerate its taint.
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
