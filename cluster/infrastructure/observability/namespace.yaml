apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    # node-exporter requires privileged PSA because it uses hostPID, hostNetwork,
    # and hostPath mounts to collect hardware/OS-level metrics from Talos nodes.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
