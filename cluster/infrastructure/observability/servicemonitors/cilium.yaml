# ServiceMonitor for Cilium agent and operator metrics.
# Cilium exposes Prometheus metrics when prometheus.enabled and
# operator.prometheus.enabled are set in the Helm values (see cilium HelmRelease).
# Cilium agent: port 9962, operator: port 9963
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cilium-agent
  namespace: observability
  labels:
    app.kubernetes.io/name: cilium-agent
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      k8s-app: cilium
  endpoints:
    - port: prometheus
      path: /metrics
      interval: 30s
      honorLabels: true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cilium-operator
  namespace: observability
  labels:
    app.kubernetes.io/name: cilium-operator
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      io.cilium/app: operator
  endpoints:
    - port: prometheus
      path: /metrics
      interval: 30s
      honorLabels: true
