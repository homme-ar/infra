apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-pushgateway
  namespace: observability
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus-pushgateway
      version: "3.8.*"
      # Reuses the existing prometheus-community HelmRepository
      # (observability/kube-prometheus-stack/repository.yaml).
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Target of the renovate-metrics pushes (see infrastructure/renovate).
    # Scraped via the ServiceMonitor in observability/servicemonitors
    # (applied after the Prometheus Operator CRDs exist).
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
