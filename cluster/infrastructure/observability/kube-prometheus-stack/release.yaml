apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "90.*"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # ── CRDs ─────────────────────────────────────────────────────────────────
    crds:
      enabled: true

    # ── Talos/Cilium compatibility ────────────────────────────────────────────
    # Cilium replaces kube-proxy — disabling avoids false scrape failures
    kubeProxy:
      enabled: false
    # Talos does not expose controller-manager or scheduler metrics on 0.0.0.0
    # by default. Disabling prevents repeated "connection refused" scrape errors.
    # These can be re-enabled later by patching Talos MachineConfig.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    # etcd in Talos requires client certificates for access; skip for now.
    kubeEtcd:
      enabled: false

    # ── Prometheus Operator ───────────────────────────────────────────────────
    prometheusOperator:
      admissionWebhooks:
        patch:
          enabled: true

    # ── Prometheus ────────────────────────────────────────────────────────────
    prometheus:
      prometheusSpec:
        retention: 15d
        retentionSize: "18GB"
        # Scrape ServiceMonitors / PodMonitors / PrometheusRules from all
        # namespaces, not just those matching Helm values. Required so
        # that additional monitors (CNPG, Longhorn, Flux, Cilium, cert-manager)
        # deployed in other namespaces are picked up automatically.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        # Persistent storage: single-node Longhorn (Prometheus handles HA
        # at the operator level via replicas, not at the volume level)
        storageSpec:
          volumeClaimTemplate:
            metadata:
              labels:
                # Include the TSDB volume in the Longhorn NAS backup jobs
                # (see docs/BACKUPS.md). Only applies to newly created PVCs —
                # existing claims were labeled manually (one-time kubectl label).
                recurring-job-group.longhorn.io/backup: enabled
            spec:
              storageClassName: ${STORAGE_CLASS_SINGLENODE}
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 2Gi
        # Allow Prometheus to run on control-plane nodes if desired
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        # External (non-k8s) targets: the auxiliary Raspberry Pi hosts.
        # node-exporter shares the in-cluster job name so the RPis show up in
        # the standard Node Exporter dashboards; `instance` is set to the
        # hostname for readability (default would be the IP:port).
        # ser-ntp1 also runs chrony (:9123) and gpsd (:9015) exporters;
        # ser-ups1 runs the apcupsd exporter (:9162).
        # AdGuard metrics come from the in-cluster adguard-exporter
        # (see observability/adguard-exporter).
        additionalScrapeConfigs:
          - job_name: node-exporter
            static_configs:
              - targets:
                  - "${SER_NTP1_IP}:9100"
                labels:
                  instance: ser-ntp1
              - targets:
                  - "${SER_DNS1_IP}:9100"
                labels:
                  instance: ser-dns1
              - targets:
                  - "${SER_UPS1_IP}:9100"
                labels:
                  instance: ser-ups1
          - job_name: ser-ntp1-chrony
            static_configs:
              - targets:
                  - "${SER_NTP1_IP}:9123"
          - job_name: ser-ntp1-gpsd
            static_configs:
              - targets:
                  - "${SER_NTP1_IP}:9015"
          - job_name: ser-ups1-apcupsd
            static_configs:
              - targets:
                  - "${SER_UPS1_IP}:9162"
          - job_name: comin
            static_configs:
              - targets:
                  - "${SER_NTP1_IP}:4243"
                labels:
                  instance: ser-ntp1
              - targets:
                  - "${SER_DNS1_IP}:4243"
                labels:
                  instance: ser-dns1
              - targets:
                  - "${SER_UPS1_IP}:4243"
                labels:
                  instance: ser-ups1
      service:
        # Label so Headlamp's prometheus plugin can autodiscover this Service
        additionalLabels:
          headlamp.dev/prometheus-service: "true"

    # ── Alertmanager ─────────────────────────────────────────────────────────
    alertmanager:
      # Private ops alerts (backups, storage internals — things that should not
      # show up on the public Gatus status page) are routed to the private ntfy
      # `alerts` topic. Opt-in per rule with the `channel: ntfy` label (see
      # observability/prometheusrules/). Everything else falls through to the
      # null receiver; user-facing alerting stays on Gatus -> ntfy `uptime`.
      config:
        route:
          receiver: "null"
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            - matchers:
                - channel = "ntfy"
              receiver: ntfy
        receivers:
          - name: "null"
          # Alertmanager cannot format its payload for ntfy, so the raw webhook
          # JSON lands as the message body — noisy but complete. The token file
          # comes from the mounted alertmanager-ntfy secret below; the ntfy
          # `alertmanager` user has write-only access to the `alerts` topic.
          - name: ntfy
            webhook_configs:
              - url: http://ntfy.ntfy.svc.cluster.local/alerts
                http_config:
                  authorization:
                    type: Bearer
                    credentials_file: /etc/alertmanager/secrets/alertmanager-ntfy/token
      alertmanagerSpec:
        secrets:
          # SOPS-encrypted ntfy bearer token (alertmanager-ntfy-secret.yaml),
          # mounted at /etc/alertmanager/secrets/alertmanager-ntfy/.
          - alertmanager-ntfy
        storage:
          volumeClaimTemplate:
            metadata:
              labels:
                # Include this volume in the Longhorn NAS backup jobs
                # (see docs/BACKUPS.md). Only applies to newly created PVCs —
                # existing claims were labeled manually (one-time kubectl label).
                recurring-job-group.longhorn.io/backup: enabled
            spec:
              storageClassName: ${STORAGE_CLASS_SINGLENODE}
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi

    # ── node-exporter ─────────────────────────────────────────────────────────
    # Talos Linux: node-exporter needs privileged PSA (applied to the namespace)
    # and tolerations so it runs on control-plane nodes as well.
    nodeExporter:
      operatingSystems:
        darwin:
          enabled: false
    prometheus-node-exporter:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      resources:
        requests:
          cpu: 50m
          memory: 30Mi
        limits:
          memory: 100Mi

    # ── kube-state-metrics ────────────────────────────────────────────────────
    kube-state-metrics:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi

    # ── Grafana ───────────────────────────────────────────────────────────────
    grafana:
      # Admin credentials from SOPS-encrypted Secret
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password

      # Persistent storage for dashboards, datasources, and plugins state
      persistence:
        enabled: true
        type: pvc
        storageClassName: ${STORAGE_CLASS_SINGLENODE}
        size: 5Gi

      # Disable embedded ingress — exposed via Gateway API HTTPRoute
      ingress:
        enabled: false

      serviceMonitor:
        enabled: true

      # Enable ConfigMap-based dashboard sidecar so any ConfigMap with
      # label grafana_dashboard: "1" is automatically imported.
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
        datasources:
          enabled: true

      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi

      grafana.ini:
        server:
          root_url: "https://grafana-adm.${CLUSTER_DOMAIN}"
        # ── Auth proxy (Authelia SSO) ─────────────────────────────────────────
        # Authelia ExternalAuth forwards identity headers directly to upstream.
        # allowedResponseHeaders in the HTTPRoute passes Remote-User, Remote-Email,
        # and Remote-Name through to Grafana. We configure auth.proxy to read
        # those native Authelia header names so no header renaming is required.
        auth:
          disable_login_form: true
          disable_signout_menu: true
        auth.proxy:
          enabled: true
          header_name: Remote-User
          header_property: username
          auto_sign_up: true
          # Map additional Authelia identity headers to Grafana user fields
          headers: "Email:Remote-Email Name:Remote-Name"
        users:
          auto_assign_org: true
          auto_assign_org_role: Admin
