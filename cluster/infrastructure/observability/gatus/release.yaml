apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: observability
spec:
  interval: 30m
  chart:
    spec:
      chart: gatus
      version: "1.5.*"
      sourceRef:
        kind: HelmRepository
        name: twin
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Alerting values carrying the ${NTFY_TOKEN} placeholder come from the
  # SOPS-encrypted gatus-values secret: Flux post-build substitution runs in
  # strict mode and would fail on the undefined variable if the placeholder
  # lived inline here. The secret stores the snippet base64-encoded (data,
  # not stringData) so envsubst never sees it, and helm-controller merges it
  # into these values untouched. Gatus then interpolates ${NTFY_TOKEN} at
  # runtime from the env var injected below.
  valuesFrom:
    - kind: Secret
      name: gatus-values
      valuesKey: values.yaml
  values:
    # Reloader restarts gatus when the gatus-values or gatus-ntfy secrets change.
    # (top-level `annotations` is applied to the Deployment metadata by the chart)
    annotations:
      reloader.stakater.com/auto: "true"
    # Recreate avoids multi-attach errors with the RWO Longhorn PVC.
    deployment:
      strategy: Recreate
    # Injects NTFY_TOKEN from the SOPS-encrypted gatus-ntfy secret, referenced
    # from the Gatus config as ${NTFY_TOKEN} (Gatus env interpolation).
    envFrom:
      - secretRef:
          name: gatus-ntfy
    persistence:
      enabled: true
      size: 1Gi
      storageClassName: ${STORAGE_CLASS}
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    config:
      storage:
        type: sqlite
        path: /data/data.db
      # Expose Prometheus metrics at /metrics.
      metrics: true
      alerting:
        ntfy:
          url: "http://ntfy.ntfy.svc.cluster.local"
          topic: "uptime"
          # token is merged in from the gatus-values secret (see valuesFrom).
          priority: 4
          click: "https://status.${CLUSTER_DOMAIN}"
          # Only provides defaults: Gatus does NOT alert unless each endpoint
          # also declares `alerts: [{type: ntfy}]` (see "Setting a default
          # alert" in the Gatus docs).
          default-alert:
            enabled: true
            failure-threshold: 3
            success-threshold: 2
            send-on-resolved: true
      # HTTP services are checked through their public FQDN so the whole chain
      # (DNS -> Gateway -> TLS -> app) is validated. Services behind Authelia
      # ext-authz are checked against their in-cluster Service instead: the
      # external URL would return an auth redirect/401 even when the app is
      # down, masking real outages. The auth chain itself is covered by the
      # Authelia endpoint.
      endpoints:
        # ── Platform ────────────────────────────────────────────────────
        - name: Index
          group: Platform
          url: https://${CLUSTER_DOMAIN}
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        - name: Authelia
          group: Platform
          url: https://auth.${CLUSTER_DOMAIN}/api/health
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        - name: NTFY
          group: Platform
          url: https://notify.${CLUSTER_DOMAIN}/v1/health
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        - name: n8n
          group: Platform
          url: https://n8n-apps.${CLUSTER_DOMAIN}/healthz
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        - name: Vaultwarden
          group: Platform
          url: https://claves-apps.${CLUSTER_DOMAIN}/alive
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        - name: IT Tools
          group: Platform
          url: https://ittools-apps.${CLUSTER_DOMAIN}
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        - name: LibreSpeed
          group: Platform
          url: https://speed-apps.${CLUSTER_DOMAIN}
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        - name: Homepage
          group: Platform
          url: http://homepage.homepage.svc.cluster.local
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        - name: Headlamp
          group: Platform
          url: http://headlamp.headlamp.svc.cluster.local
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        - name: WAHA
          group: Platform
          url: http://waha.waha.svc.cluster.local
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        # Homebox uses OIDC against Authelia, so the external URL would
        # redirect to the IdP; check the in-cluster Service health endpoint.
        - name: Homebox
          group: Platform
          url: http://homebox.homebox.svc.cluster.local/api/v1/status
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        # ── Media ───────────────────────────────────────────────────────
        - name: Jellyfin
          group: Media
          url: https://jellyfin-apps.${CLUSTER_DOMAIN}/health
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        - name: Seerr
          group: Media
          url: https://seerr-apps.${CLUSTER_DOMAIN}/api/v1/status
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        - name: Sonarr
          group: Media
          url: http://sonarr.sonarr.svc.cluster.local/ping
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        - name: Radarr
          group: Media
          url: http://radarr.radarr.svc.cluster.local/ping
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        - name: Lidarr
          group: Media
          url: http://lidarr.lidarr.svc.cluster.local/ping
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        - name: Prowlarr
          group: Media
          url: http://prowlarr.prowlarr.svc.cluster.local/ping
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        - name: Bazarr
          group: Media
          url: http://bazarr.bazarr.svc.cluster.local
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        - name: SABnzbd
          group: Media
          url: http://sabnzbd.sabnzbd.svc.cluster.local/
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        - name: Maintainerr
          group: Media
          url: http://maintainerr.maintainerr.svc.cluster.local/login
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        # ── IoT ─────────────────────────────────────────────────────────
        - name: Home Assistant
          group: IoT
          url: https://ha.${CLUSTER_DOMAIN}
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        - name: ESPHome
          group: IoT
          url: http://esphome.esphome.svc.cluster.local
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        - name: Zigbee2MQTT
          group: IoT
          url: http://zigbee2mqtt.zigbee2mqtt.svc.cluster.local
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        - name: Frigate
          group: IoT
          url: http://frigate.frigate.svc.cluster.local
          conditions:
            # The authenticated UI redirects to /login (302) when probed
            # without a session, so accept any non-error status. The
            # in-cluster URL intentionally bypasses Authelia (the public
            # auth chain is covered by the Authelia endpoint).
            - "[STATUS] < 400"
          alerts:
            - type: ntfy
        # ── Infrastructure ──────────────────────────────────────────────
        - name: Kubernetes API
          group: Infrastructure
          url: https://10.0.20.1:6443/healthz
          client:
            insecure: true
          # Talos disables anonymous auth, so /healthz answers 401 — that is
          # enough to prove the API endpoint and TLS handshake are healthy.
          conditions:
            - "[STATUS] == 401"
          alerts:
            - type: ntfy
        - name: AdGuard DNS
          group: Infrastructure
          url: ${SER_DNS1_IP}
          dns:
            query-name: ${CLUSTER_DOMAIN}
            query-type: A
          conditions:
            - "[DNS_RCODE] == NOERROR"
          alerts:
            - type: ntfy
        - name: NAS (NFS)
          group: Infrastructure
          url: tcp://${NAS_IP}:2049
          conditions:
            - "[CONNECTED] == true"
          alerts:
            - type: ntfy
        - name: PostgreSQL (CNPG)
          group: Infrastructure
          url: tcp://${LB_POSTGRES_IP}:5432
          conditions:
            - "[CONNECTED] == true"
          alerts:
            - type: ntfy
        # Polls Prometheus for firing alerts from the postgres-backup
        # PrometheusRule (observability/prometheusrules/) and notifies via the
        # default NTFY alerting — Alertmanager itself has no receivers. The
        # query returns an empty result array when nothing is firing, which
        # len() can check (Gatus placeholders cannot index into Prometheus'
        # nested value arrays, and multi-param Alertmanager URLs get mangled).
        - name: Postgres backup alerts
          group: Infrastructure
          interval: 2m
          url: "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/query?query=ALERTS%7Balertname%3D~%22PostgresWal.*%7CPostgresBackup.*%7CVersitygwMeta.*%7CPostgresVolume.*%22%2Calertstate%3D%22firing%22%7D"
          conditions:
            - "[STATUS] == 200"
            - "len([BODY].data.result) == 0"
          alerts:
            - type: ntfy
        - name: Mosquitto (MQTT)
          group: Infrastructure
          url: tcp://${LB_MQTT_IP}:1883
          conditions:
            - "[CONNECTED] == true"
          alerts:
            - type: ntfy
        - name: Grafana
          group: Infrastructure
          url: http://kube-prometheus-stack-grafana.observability.svc.cluster.local/api/health
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
        - name: Longhorn UI
          group: Infrastructure
          url: http://longhorn-frontend.longhorn-system.svc.cluster.local
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: ntfy
