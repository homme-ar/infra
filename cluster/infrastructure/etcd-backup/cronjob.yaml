# Daily etcd snapshot of the Talos control plane, written directly to the
# QNAP NFS share (/backup/etcd). Snapshots are kept for 14 days.
#
# Uses a talosconfig limited to the `os:etcd:backup` role (see
# talosconfig-secret.yaml) — it can ONLY take snapshots, not administer nodes.
# talosctl itself is downloaded (pinned + sha256-verified) by an initContainer
# so no unofficial image is trusted.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: backup
  labels:
    app.kubernetes.io/name: etcd-backup
spec:
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: etcd-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
          initContainers:
            - name: fetch-talosctl
              image: alpine:3.24
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  wget -q https://github.com/siderolabs/talos/releases/download/v1.13.6/talosctl-linux-amd64 -O /tools/talosctl
                  echo "540c5e7cb0d3fa3a9b2e1c717ced212727b73bcaf0cf9cf9ba2472ec381041d4  /tools/talosctl" | sha256sum -c -
                  chmod +x /tools/talosctl
              volumeMounts:
                - name: tools
                  mountPath: /tools
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: snapshot
              image: alpine:3.24
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TS=$(date +%F-%H%M)
                  OUT="/out/etcd-snapshot-$${TS}.db"
                  # Try each control-plane node until one answers
                  for NODE in 192.0.2.2 192.0.2.3 192.0.2.4; do
                    echo "Attempting etcd snapshot from $${NODE}..."
                    if /tools/talosctl --talosconfig /secrets/talosconfig -n "$${NODE}" -e "$${NODE}" etcd snapshot "$${OUT}"; then
                      echo "Snapshot saved: $${OUT}"
                      break
                    fi
                  done
                  test -s "$${OUT}"
                  # Retention: keep 14 days of snapshots
                  find /out -name 'etcd-snapshot-*.db' -mtime +14 -delete
                  ls -la /out
              volumeMounts:
                - name: tools
                  mountPath: /tools
                - name: talosconfig
                  mountPath: /secrets
                  readOnly: true
                - name: out
                  mountPath: /out
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: tools
              emptyDir: {}
            - name: talosconfig
              secret:
                secretName: etcd-backup-talosconfig
            - name: out
              nfs:
                server: ${NAS_IP}
                path: /backup/etcd
