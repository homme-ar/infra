apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: "1.13.*"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    defaultSettings:
      # Use /var/lib/longhorn corresponding to the SKC3000 NVMe disk mounts on all Talos nodes
      defaultDataPath: "/var/lib/longhorn"
      createDefaultDiskLabeledNodes: false
      v2DataEngine: true
      # Backup target: QNAP NAS over NFS. No credential secret needed for NFS.
      # Note the Longhorn URL format requires ":" after the host.
      backupTarget: "nfs://${NAS_IP}:/backup/longhorn"
      backupstorePollInterval: 300
    persistence:
      dataEngine: v2
    csi:
      # Talos Linux stores kubelet state inside /var/lib/kubelet
      kubeletRootDir: "/var/lib/kubelet"
    networkPolicies:
      # The chart's internal NetworkPolicies (restrictInternalTraffic, default-on since
      # 1.12.1) block port 9500 for everything except Longhorn's own pods — including the
      # Prometheus scrape from the `observability/longhorn` ServiceMonitor. Chart >= 1.13.0
      # knob to punch a hole just for the Prometheus pods.
      metricsScrapeSources:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: kube-prometheus-stack-prometheus
    ingress:
      # Disable embedded ingress in favor of Gateway API HTTPRoute
      enabled: false
