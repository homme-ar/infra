# Recurring backup jobs to the QNAP NAS (backupTarget configured in release.yaml).
# Volumes opt in via the label `recurring-job-group.longhorn.io/backup: enabled`
# on their PVC (Longhorn propagates PVC labels to the volume via CSI).
# Deliberately excluded: CNPG volumes (backed up via barmanObjectStore),
# ntfy-cache and waha-media (regenerable data).
#
# TEMPORARILY DISABLED (2026-07-29): V2 (SPDK) backups on Longhorn v1.12.0 flap
# the shared NVMe-oF controllers of production volumes during the backup window,
# causing ext4 emergency read-only remounts and crash-looping pods (postgres-1
# was down for 2 days, one volume was auto-salvaged). Upstream bug fixed in
# v1.12.1: https://github.com/longhorn/longhorn/issues/13331
# Tracking: https://github.com/homme-ar/infra/issues/20
# Re-enable (uncomment both RecurringJobs) once Longhorn v1.12.1 is rolled out.
#
# apiVersion: longhorn.io/v1beta2
# kind: RecurringJob
# metadata:
#   name: backup-daily
#   namespace: longhorn-system
#   labels:
#     app.kubernetes.io/name: longhorn
#     app.kubernetes.io/component: backup
# spec:
#   name: backup-daily
#   task: backup
#   cron: "0 3 * * *"
#   retain: 7
#   concurrency: 2
#   groups:
#     - backup
# ---
# apiVersion: longhorn.io/v1beta2
# kind: RecurringJob
# metadata:
#   name: backup-weekly
#   namespace: longhorn-system
#   labels:
#     app.kubernetes.io/name: longhorn
#     app.kubernetes.io/component: backup
# spec:
#   name: backup-weekly
#   task: backup
#   cron: "0 4 * * 0"
#   retain: 4
#   concurrency: 2
#   groups:
#     - backup
