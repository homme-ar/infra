# Recurring backup jobs to the QNAP NAS (backupTarget configured in release.yaml).
# Volumes opt in via the label `recurring-job-group.longhorn.io/backup: enabled`
# on their PVC (Longhorn propagates PVC labels to the volume via CSI).
# Deliberately excluded: CNPG volumes (backed up via barmanObjectStore),
# ntfy-cache and waha-media (regenerable data).
#
# NOTE: V2 (SPDK) backups on Longhorn v1.12.0 flapped the shared NVMe-oF
# controllers of production volumes during the backup window (ext4 emergency
# read-only remounts, crash-looping pods). Fixed upstream in v1.12.1:
# https://github.com/longhorn/longhorn/issues/13331
# Re-enabled 2026-08-17 after the v1.12.1 rollout (homme-ar/infra#20).
#
# GOTCHA (hit 2026-08-22/23): the Helm upgrade to v1.12.1 did NOT activate the
# fix — the v2 instance-managers kept running v1.12.0 because they are only
# replaced once they hold zero instances, and the RO remounts kept happening
# on every backup window. Fixed 2026-08-23 by draining all volumes (full
# workload bounce) so the v1.12.0 IMs were auto-deleted and replaced.
# After ANY Longhorn upgrade, verify the running v2 IMs match the chart version:
#   kubectl -n longhorn-system get instancemanagers.longhorn.io \
#     -o custom-columns=NODE:.spec.nodeID,ENGINE:.spec.dataEngine,IMAGE:.spec.image,STATE:.status.currentState
# See docs/BACKUPS.md "Read-only filesystems during backups" for detection and
# recovery procedures.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/component: backup
spec:
  name: backup-daily
  task: backup
  cron: "0 3 * * *"
  retain: 7
  concurrency: 2
  groups:
    - backup
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-weekly
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/component: backup
spec:
  name: backup-weekly
  task: backup
  cron: "0 4 * * 0"
  retain: 4
  concurrency: 2
  groups:
    - backup
