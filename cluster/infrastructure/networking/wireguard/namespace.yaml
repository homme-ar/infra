apiVersion: v1
kind: Namespace
metadata:
  name: wireguard-system
  labels:
    # wireguard-operator agent requires NET_ADMIN and the sysctl init container
    # requires privileged mode — exempt from the default baseline policy.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
