apiVersion: vpn.wireguard-operator.io/v1alpha1
kind: Wireguard
metadata:
  name: vpn
  namespace: wireguard-system
spec:
  # MTU tuned for typical homelab ISP tunnels.
  mtu: "1380"
  # DNS servers pushed to all peers (AdGuard Home + public fallback).
  dns: "${SER_DNS1_IP}, 1.1.1.1"
  # Public hostname peers use as their endpoint.
  externalAddress: "vpn.${CLUSTER_DOMAIN}"
  serviceType: LoadBalancer
  # Reserve a dedicated IP from the Cilium L2 announcement pool.
  serviceAnnotations:
    io.cilium/lb-ipam-ips: "${LB_VPN_IP}"
  # Enable IP forwarding on pod init so peers can reach external networks.
  enableIpForwardOnPodInit: true
