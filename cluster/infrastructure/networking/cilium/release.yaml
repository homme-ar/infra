apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: "1.20.1"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    gatewayAPI:
      enabled: true
    ipam:
      mode: kubernetes
    kubeProxyReplacement: true
    l2announcements:
      enabled: true
    externalIPs:
      enabled: true
    devices: ${NETWORK_INTERFACE}
    k8sClientRateLimit:
      qps: 50
      burst: 200
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    k8sServiceHost: localhost
    k8sServicePort: 7445
    routingMode: tunnel
    tunnelProtocol: vxlan
    operator:
      replicas: 1
      # Expose Cilium operator metrics on port 9963 for Prometheus scraping.
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
      # Expose Hubble flow metrics for Prometheus scraping.
      # These provide L3/L4/L7 network observability data.
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - "httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction"
        serviceMonitor:
          enabled: true
    # ── Prometheus metrics ────────────────────────────────────────────────────
    # Expose Cilium agent metrics on port 9962 for Prometheus scraping.
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
