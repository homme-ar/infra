apiVersion: v1
kind: Service
metadata:
  name: legacy-dns
  namespace: legacy
  annotations:
    io.cilium/lb-ipam-ips: 10.0.21.10
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: legacy-dns
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
