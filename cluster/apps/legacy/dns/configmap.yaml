apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-dns-config
  namespace: legacy
data:
  Corefile: |
    homme.ar:53 {
        errors
        log
        template IN A {
            answer "{{ .Name }} 60 IN A 10.0.21.1"
        }
        template IN AAAA {
            rcode NOERROR
        }
    }

    .:53 {
        errors
        log
        health {
            lameduck 5s
        }
        ready
        forward . 1.1.1.1 8.8.8.8
        cache 30
        loop
        reload
        loadbalance
    }
