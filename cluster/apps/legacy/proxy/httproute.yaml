apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: legacy-fallback-http
  namespace: legacy
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: kube-system
      sectionName: http
    - name: envoy-gateway
      namespace: kube-system
      sectionName: https
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: legacy-cluster-ingress
          port: 80
