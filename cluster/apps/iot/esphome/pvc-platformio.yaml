apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: esphome-platformio
  namespace: esphome
  labels:
    app.kubernetes.io/name: esphome
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ${STORAGE_CLASS}
  resources:
    requests:
      storage: 30Gi
