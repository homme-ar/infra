apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Do NOT set `namespace:` here — it can re-write the metadata.namespace of
# any SOPS-encrypted Secret and corrupt its MAC, causing Flux SOPS decryption
# to fail. Every resource already declares its own namespace inline.
resources:
  - namespace.yaml
  - pvc-data.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
