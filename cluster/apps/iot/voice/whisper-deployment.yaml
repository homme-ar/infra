apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  namespace: voice
  labels:
    app.kubernetes.io/name: whisper
    app.kubernetes.io/component: stt
spec:
  replicas: 1
  # Recreate ensures the RWO PVC is released before a new pod attaches it,
  # preventing multi-attach errors during rollouts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: whisper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whisper
    spec:
      # The nvidia.com/gpu request pins scheduling to ser-msa2cp1 (the only
      # GPU node); the nvidia runtime handler injects the driver libraries.
      runtimeClassName: nvidia
      securityContext:
        fsGroup: 1000
      containers:
        - name: whisper
          image: lscr.io/linuxserver/faster-whisper:3.8.1-gpu
          imagePullPolicy: IfNotPresent
          ports:
            - name: wyoming
              containerPort: 10300
              protocol: TCP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Argentina/Buenos_Aires
            # medium (~3GB VRAM at fp16): good Spanish accuracy at ~1s
            # latency. Fits the A2000 alongside qwen2.5:7b (~4.7GB) with
            # headroom for subgen/Jellyfin.
            - name: WHISPER_MODEL
              value: medium
            # Pin Spanish: skips auto language detection (faster, and avoids
            # mis-detections on short commands).
            - name: WHISPER_LANG
              value: es
            - name: WHISPER_BEAM
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 8Gi
              nvidia.com/gpu: "1"
          livenessProbe:
            tcpSocket:
              port: wyoming
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: wyoming
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: whisper-config
