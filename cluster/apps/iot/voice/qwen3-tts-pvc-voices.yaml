apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen3-tts-voices
  namespace: voice
  labels:
    app.kubernetes.io/name: qwen3-tts
    app.kubernetes.io/component: storage
    # The uploaded voice (speaker embedding + reference audio) cannot be
    # regenerated without the original WAV, so include it in the Longhorn
    # NAS backup jobs (see docs/BACKUPS.md).
    recurring-job-group.longhorn.io/backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ${STORAGE_CLASS_SINGLENODE}
  resources:
    requests:
      storage: 2Gi
