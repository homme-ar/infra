# LAN-only entrypoint for external Wyoming/TCP clients (e.g. the live-tarot dev
# stack): ${LB_PIPER_IP}:10200. Wyoming is raw TCP, so it cannot go through the
# Gateway/HTTPRoute; the dedicated LoadBalancer IP is announced via L2 on the
# LAN. Home Assistant keeps using piper.voice.svc.cluster.local:10200.
apiVersion: v1
kind: Service
metadata:
  name: piper
  namespace: voice
  labels:
    app.kubernetes.io/name: piper
    app.kubernetes.io/component: tts
  annotations:
    io.cilium/lb-ipam-ips: "${LB_PIPER_IP}"
spec:
  type: LoadBalancer
  ports:
    - name: wyoming
      port: 10200
      targetPort: wyoming
      protocol: TCP
  selector:
    app.kubernetes.io/name: piper
