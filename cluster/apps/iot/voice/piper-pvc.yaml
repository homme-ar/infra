apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: piper-config
  namespace: voice
  labels:
    app.kubernetes.io/name: piper
    app.kubernetes.io/component: storage
  # No recurring-job-group.longhorn.io/backup label: regenerable model cache.
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ${STORAGE_CLASS_SINGLENODE}
  resources:
    requests:
      storage: 2Gi
