apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen3-tts-models
  namespace: voice
  labels:
    app.kubernetes.io/name: qwen3-tts
    app.kubernetes.io/component: storage
  # No recurring-job-group.longhorn.io/backup label: HuggingFace weights are
  # re-downloaded on first start. Uploaded voices live on their own PVC.
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ${STORAGE_CLASS_SINGLENODE}
  resources:
    requests:
      storage: 25Gi
