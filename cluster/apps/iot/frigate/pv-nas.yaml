apiVersion: v1
kind: PersistentVolume
metadata:
  name: frigate-nas
  labels:
    app.kubernetes.io/name: frigate
    app.kubernetes.io/component: storage
spec:
  capacity:
    # Nominal size; the real capacity is whatever the QNAP share has.
    storage: 1Pi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: ${NAS_IP}
    path: ${NAS_SHARE_PATH}/nvr
    readOnly: false
