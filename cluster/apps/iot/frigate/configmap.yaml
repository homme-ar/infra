apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-config
  namespace: frigate
  labels:
    app.kubernetes.io/name: frigate
    app.kubernetes.io/component: server
data:
  config.yml: |
    mqtt:
      enabled: false

    # USB Coral TPUs. Frigate runs one detector process per device and feeds
    # all cameras from a common detection queue. NOTE: a configured detector
    # whose device is missing makes Frigate exit (crash loop) — if a Coral
    # dies, comment it out before committing.
    detectors:
      coral1:
        type: edgetpu
        device: usb:0
      coral2:
        type: edgetpu
        device: usb:1

    # YOLOv9-s compiled for EdgeTPU (320x320, INT8): more accurate than the
    # default MobileDet. Files live on the node-local hostPath (/config is the
    # ConfigMap mount, read-only). Labelmap is the fixed 17-class COCO subset
    # the model was trained on — it cannot be extended.
    model:
      model_type: yolo-generic
      width: 320
      height: 320
      path: /config/model_cache/yolov9-s-relu6-best_320_int8_edgetpu.tflite
      labelmap_path: /config/model_cache/labels-coco17.txt

    # Intel N100 iGPU (VA-API) for ffmpeg decode/scale of all streams.
    ffmpeg:
      hwaccel_args: preset-vaapi

    # The Gateway terminates TLS publicly; keep the internal authenticated
    # port 8971 as plain HTTP so the HTTPRoute backend does not hit Frigate's
    # self-signed cert (tls.enabled defaults to true in 0.17).
    tls:
      enabled: false
    # Authelia at the gateway is the only auth door: Frigate's native auth is
    # disabled because proxy.header_map is only honored when it is. Direct
    # in-cluster access (no headers) falls back to the viewer role.
    auth:
      enabled: false

    # SSO via Authelia at the gateway: trust the identity headers forwarded
    # by the ExternalAuth filter (allowedResponseHeaders in httproute.yaml).
    # role_map values must match the group names in the Authelia users
    # database (the SOPS-encrypted authelia-users secret).
    proxy:
      default_role: viewer
      header_map:
        user: remote-user
        role: remote-groups
        role_map:
          admin:
            - admins
          viewer:
            - users
      logout_url: https://auth.${CLUSTER_DOMAIN}/logout

    # 0.17 record schema: continuous segments retained 3 days, segments with
    # motion 7 days, segments with alerts/detections 30 days. All of it lives
    # on the NAS (~366 GB/day measured across all cameras -> ~2-3 TB total).
    record:
      enabled: true
      continuous:
        days: 3
      motion:
        days: 7
      alerts:
        retain:
          days: 30
      detections:
        retain:
          days: 30

    # Detection on the low-res sub streams at their native resolution.
    detect:
      enabled: true
      fps: 5

    # Tracked objects: subset of the model's 17-class labelmap (train, boat,
    # sheep, elephant and bear excluded as irrelevant for this location).
    objects:
      track:
        - person
        - bicycle
        - car
        - motorcycle
        - airplane
        - bus
        - truck
        - bird
        - cat
        - dog
        - horse
        - cow

    # go2rtc restream: single connection per camera stream, enables audio in
    # live view (MSE needs AAC — all cameras already send AAC) and two-way
    # talk. The primary RTSP source must stay non-prefixed (no "ffmpeg:") so
    # go2rtc owns the stream and can negotiate the backchannel for two-way
    # audio; the ffmpeg secondary only adds an opus track for WebRTC.
    # Stream names must match the camera names for the UI integration.
    go2rtc:
      streams:
        fre_cam1:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.0.2.22:554/h264Preview_01_main
          - "ffmpeg:fre_cam1#audio=opus"
        fre_cam1_sub:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.0.2.22:554/h264Preview_01_sub
        fre_cam2:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.0.2.23:554/h265Preview_01_main
          - "ffmpeg:fre_cam2#audio=opus"
        fre_cam2_sub:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.0.2.23:554/h265Preview_01_sub
        fre_cam3:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.0.2.24:554/h265Preview_01_main
          - "ffmpeg:fre_cam3#audio=opus"
        fre_cam3_sub:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.0.2.24:554/h265Preview_01_sub
        pag_cam1:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.0.2.25:554/h265Preview_01_main
          - "ffmpeg:pag_cam1#audio=opus"
        pag_cam1_sub:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.0.2.25:554/h265Preview_01_sub
        pag_cam2:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.0.2.26:554/h265Preview_01_main
          - "ffmpeg:pag_cam2#audio=opus"
        pag_cam2_sub:
          - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.0.2.26:554/h265Preview_01_sub
      # WebRTC (required for two-way talk) needs a direct TCP/UDP connection
      # to go2rtc on 8555: the frigate-webrtc LoadBalancer Service announces
      # this IP on the LAN (also reachable over WireGuard).
      webrtc:
        candidates:
          - ${LB_FRIGATE_WEBRTC_IP}:8555

    cameras:
      # Reolink Doorbell PoE (H.264 + AAC)
      fre_cam1:
        enabled: true
        ffmpeg:
          output_args:
            record: preset-record-generic-audio-copy
          inputs:
            - path: rtsp://127.0.0.1:8554/fre_cam1
              input_args: preset-rtsp-restream
              roles: [record]
            - path: rtsp://127.0.0.1:8554/fre_cam1_sub
              input_args: preset-rtsp-restream
              roles: [detect]
        live:
          streams:
            Main: fre_cam1
            Sub: fre_cam1_sub
      # Reolink 811A #1 (4K; main stream configured as H.264 in the camera)
      fre_cam2:
        enabled: true
        ffmpeg:
          output_args:
            record: preset-record-generic-audio-copy
          inputs:
            - path: rtsp://127.0.0.1:8554/fre_cam2
              input_args: preset-rtsp-restream
              roles: [record]
            - path: rtsp://127.0.0.1:8554/fre_cam2_sub
              input_args: preset-rtsp-restream
              roles: [detect]
        live:
          streams:
            Main: fre_cam2
            Sub: fre_cam2_sub
      # Reolink 811A #2 (4K H.265)
      fre_cam3:
        enabled: true
        ffmpeg:
          apple_compatibility: true # H.265: adds hvc1 tag for Safari playback
          output_args:
            record: preset-record-generic-audio-copy
          inputs:
            - path: rtsp://127.0.0.1:8554/fre_cam3
              input_args: preset-rtsp-restream
              roles: [record]
            - path: rtsp://127.0.0.1:8554/fre_cam3_sub
              input_args: preset-rtsp-restream
              roles: [detect]
        live:
          streams:
            Main: fre_cam3
            Sub: fre_cam3_sub
      # Reolink Duo 3 PoE (dual-lens 180 panorama, single combined stream)
      pag_cam1:
        enabled: true
        ffmpeg:
          apple_compatibility: true
          output_args:
            record: preset-record-generic-audio-copy
          inputs:
            - path: rtsp://127.0.0.1:8554/pag_cam1
              input_args: preset-rtsp-restream
              roles: [record]
            - path: rtsp://127.0.0.1:8554/pag_cam1_sub
              input_args: preset-rtsp-restream
              roles: [detect]
        live:
          streams:
            Main: pag_cam1
            Sub: pag_cam1_sub
      # Reolink Duo 2 PoE (dual-lens 180 panorama, single combined stream)
      pag_cam2:
        enabled: true
        ffmpeg:
          apple_compatibility: true
          output_args:
            record: preset-record-generic-audio-copy
          inputs:
            - path: rtsp://127.0.0.1:8554/pag_cam2
              input_args: preset-rtsp-restream
              roles: [record]
            - path: rtsp://127.0.0.1:8554/pag_cam2_sub
              input_args: preset-rtsp-restream
              roles: [detect]
        live:
          streams:
            Main: pag_cam2
            Sub: pag_cam2_sub
