apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home-assistant
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/href: "https://ha.${CLUSTER_DOMAIN}"
    gethomepage.dev/group: IoT
    gethomepage.dev/weight: "10"
    gethomepage.dev/name: Home Assistant
    gethomepage.dev/icon: home-assistant.png
    gethomepage.dev/description: Home automation
    gethomepage.dev/widget.type: "homeassistant"
    gethomepage.dev/widget.url: "http://home-assistant.home-assistant"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_HA_TOKEN}}"
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - "ha.${CLUSTER_DOMAIN}"
    # LAN-only alias used as the internal URL by the HA companion app, so it
    # fails over to the public URL cleanly when leaving the home WiFi.
    - "ha-local.${CLUSTER_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: home-assistant
          port: 80
