apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Do NOT set `namespace:` here — it re-writes the metadata.namespace of the
# SOPS-encrypted Secret and corrupts its MAC, causing Flux SOPS decryption
# to fail. Every resource already declares its own namespace inline.
resources:
  - namespace.yaml
  # Home Assistant recorder DB lives on the shared CNPG PG18 cluster in the
  # `postgres` namespace. The `homeassistant` role, DB and password secret
  # are declared under cluster/apps/platform/postgres/.
  - recorder-secret.yaml
  - pvc-config.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
