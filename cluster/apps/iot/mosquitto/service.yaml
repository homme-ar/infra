apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: mosquitto
  labels:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/component: broker
  annotations:
    # Reserve a dedicated LB IP for the MQTT broker (Cilium L2 announcement).
    io.cilium/lb-ipam-ips: "${LB_MQTT_IP}"
spec:
  type: LoadBalancer
  # Cluster policy allows any node to receive and forward traffic regardless
  # of where the mosquitto pod is scheduled (required for Cilium L2 VIP).
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
      protocol: TCP
    - name: websocket
      port: 9001
      targetPort: websocket
      protocol: TCP
