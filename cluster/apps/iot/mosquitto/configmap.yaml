apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: mosquitto
  labels:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/component: config
data:
  mosquitto.conf: |
    listener 1883
    protocol mqtt

    listener 9001
    protocol websockets

    log_dest stdout

    persistence true
    persistence_location /mosquitto/data/

    allow_anonymous false
    password_file /mosquitto/config/passwd
