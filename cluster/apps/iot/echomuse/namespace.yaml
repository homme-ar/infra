apiVersion: v1
kind: Namespace
metadata:
  name: echomuse
  labels:
    # The controller requires privileged PSA because it uses hostNetwork:
    # it advertises itself over mDNS for LAN discovery by the Echo Dots and
    # opens one ESPHome TCP port per device (16001+), neither of which works
    # behind pod NAT.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
