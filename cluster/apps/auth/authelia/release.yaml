apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: auth
spec:
  interval: 30m
  chart:
    spec:
      chart: authelia
      version: "0.9.*"
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    secret:
      existingSecret: authelia-secret
    pod:
      replicas: 1
      extraVolumes:
        - name: authelia-users
          secret:
            secretName: authelia-secret
      extraVolumeMounts:
        - name: authelia-users
          mountPath: /config/users_database.yml
          subPath: users_database.yml
          readOnly: true
    configMap:
      theme: dark
      server:
        host: 0.0.0.0
        port: 80
      log:
        level: info
      default_2fa_method: totp
      authentication_backend:
        file:
          path: /config/users_database.yml
      access_control:
        default_policy: two_factor
        rules:
          - domain:
              - "longhorn-adm.homme.ar"
            policy: one_factor
          - domain:
              - "*.homme.ar"
            policy: two_factor
      session:
        name: authelia_session
        domain: homme.ar
      storage:
        local:
          path: /config/db.sqlite3
    persistence:
      enabled: true
      storageClass: longhorn
      accessMode: ReadWriteOnce
      size: 1Gi
    service:
      port: 80
