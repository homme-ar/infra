apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd
  namespace: sabnzbd
  labels:
    app.kubernetes.io/name: sabnzbd
    app.kubernetes.io/component: server
spec:
  replicas: 1
  # Recreate ensures the RWO Longhorn PVC is released before a new pod
  # attaches it, preventing multi-attach errors and SQLite corruption.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sabnzbd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sabnzbd
    spec:
      # LinuxServer images must start as root: their s6-overlay init applies
      # the PUID/PGID mapping and then drops to the unprivileged abc user
      # (UID/GID 1000), which is the owner used on the QNAP NFS share.
      securityContext:
        fsGroup: 1000
      containers:
        - name: sabnzbd
          image: lscr.io/linuxserver/sabnzbd:5.1.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Argentina/Buenos_Aires
          # No capability drops here: the s6-overlay init needs CHOWN/SETUID/
          # SETGID to fix /config ownership before dropping to the abc user.
          # The app process itself ends up running unprivileged (PUID 1000).
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              # 6Gi: SABnzbd 5.x defaults to a 1G article cache (cache_limit),
              # but unrar/par2 repair of large downloads can push RSS well past
              # 2Gi — that limit was still getting the pod OOM-killed.
              memory: 6Gi
          # SABnzbd has no unauthenticated health endpoint, so probe the TCP
          # port instead of an HTTP path.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
            # /data/usenet/{incomplete,complete} used for downloads
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sabnzbd-config
        - name: data
          persistentVolumeClaim:
            claimName: nas-media
