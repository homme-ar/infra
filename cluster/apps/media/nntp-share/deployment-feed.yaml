apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-proxy
  namespace: nntp-share
  labels:
    app.kubernetes.io/name: nntp-share
    app.kubernetes.io/component: feed-proxy
  annotations:
    # Restart automatically when the nginx template ConfigMap or the
    # nntp-share Secret change (config is subPath-mounted, no hot reload).
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nntp-share
      app.kubernetes.io/component: feed-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nntp-share
        app.kubernetes.io/component: feed-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: nntp-share
          env:
            # Only these two variables are substituted into the template.
            - name: NGINX_ENVSUBST_FILTER
              value: "^(FRIEND_FEED_API_KEY|PROWLARR_API_KEY)$"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: nginx-template
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
      volumes:
        - name: nginx-template
          configMap:
            name: feed-nginx-template
