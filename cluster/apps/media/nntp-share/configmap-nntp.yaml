# NNTPS proxy with credential mapping. The friend connects with custom
# credentials; the proxy validates them, dials the real provider over TLS,
# rewrites AUTHINFO with the real credentials, and then pipes both directions
# transparently so every other NNTP command works unchanged.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nntp-proxy-script
  namespace: nntp-share
  labels:
    app.kubernetes.io/name: nntp-share
    app.kubernetes.io/component: nntp-proxy
data:
  nntp_proxy.py: |
    import asyncio
    import logging
    import os
    import ssl
    import sys

    LISTEN_PORT = int(os.environ.get("LISTEN_PORT", "8563"))
    UPSTREAM_HOST = os.environ["UPSTREAM_HOST"]
    UPSTREAM_PORT = int(os.environ.get("UPSTREAM_PORT", "563"))
    FRIEND_USERNAME = os.environ["FRIEND_NNTP_USERNAME"]
    FRIEND_PASSWORD = os.environ["FRIEND_NNTP_PASSWORD"]
    UPSTREAM_USERNAME = os.environ["NNTP_UPSTREAM_USERNAME"]
    UPSTREAM_PASSWORD = os.environ["NNTP_UPSTREAM_PASSWORD"]
    TLS_CERT = os.environ.get("TLS_CERT", "/tls/tls.crt")
    TLS_KEY = os.environ.get("TLS_KEY", "/tls/tls.key")
    MAX_CONNECTIONS = int(os.environ.get("MAX_CONNECTIONS", "30"))
    AUTH_TIMEOUT = 30

    log = logging.getLogger("nntp-proxy")
    semaphore = asyncio.Semaphore(MAX_CONNECTIONS)


    async def readline(reader):
        line = await reader.readline()
        if not line:
            raise ConnectionError("peer disconnected")
        return line.decode("utf-8", "replace").rstrip("\r\n")


    async def authenticate(reader, writer):
        """Pre-auth command loop. Returns True once the friend creds check out."""
        user = None
        for _ in range(10):
            line = await asyncio.wait_for(readline(reader), AUTH_TIMEOUT)
            cmd, _, arg = line.partition(" ")
            cmd = cmd.upper()
            if cmd == "QUIT":
                writer.write(b"205 Goodbye\r\n")
                await writer.drain()
                return False
            if cmd == "AUTHINFO" and arg.upper().startswith("USER "):
                user = arg[5:].strip()
                writer.write(b"381 Password required\r\n")
            elif cmd == "AUTHINFO" and arg.upper().startswith("PASS "):
                if user == FRIEND_USERNAME and arg[5:].strip() == FRIEND_PASSWORD:
                    return True
                writer.write(b"502 Authentication failed\r\n")
                await writer.drain()
                return False
            else:
                writer.write(b"480 Authentication required\r\n")
            await writer.drain()
        return False


    async def upstream_connect():
        context = ssl.create_default_context()
        reader, writer = await asyncio.open_connection(
            UPSTREAM_HOST, UPSTREAM_PORT, ssl=context
        )
        await readline(reader)  # 200/201 greeting
        writer.write(f"AUTHINFO USER {UPSTREAM_USERNAME}\r\n".encode())
        await writer.drain()
        await readline(reader)  # 381
        writer.write(f"AUTHINFO PASS {UPSTREAM_PASSWORD}\r\n".encode())
        await writer.drain()
        response = await readline(reader)
        if not response.startswith("281"):
            raise ConnectionError("upstream authentication failed")
        return reader, writer


    async def pipe(reader, writer):
        try:
            while True:
                data = await reader.read(65536)
                if not data:
                    break
                writer.write(data)
                await writer.drain()
        except (ConnectionError, asyncio.IncompleteReadError):
            pass
        finally:
            writer.close()


    async def handle(reader, writer):
        if semaphore.locked():
            writer.write(b"502 Too many connections, try later\r\n")
            await writer.drain()
            writer.close()
            return
        async with semaphore:
            peer = writer.get_extra_info("peername")
            try:
                writer.write(b"200 NNTP proxy ready\r\n")
                await writer.drain()
                if not await authenticate(reader, writer):
                    return
                up_reader, up_writer = await upstream_connect()
                writer.write(b"281 Authentication accepted\r\n")
                await writer.drain()
                log.info("session established for %s", peer)
                to_upstream = asyncio.create_task(pipe(reader, up_writer))
                to_client = asyncio.create_task(pipe(up_reader, writer))
                _, pending = await asyncio.wait(
                    {to_upstream, to_client}, return_when=asyncio.FIRST_COMPLETED
                )
                for task in pending:
                    task.cancel()
            except (ConnectionError, asyncio.TimeoutError, ssl.SSLError) as exc:
                log.warning("session error from %s: %s", peer, exc)
            finally:
                writer.close()


    async def main():
        context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
        context.load_cert_chain(TLS_CERT, TLS_KEY)
        server = await asyncio.start_server(handle, "0.0.0.0", LISTEN_PORT, ssl=context)
        log.info("listening on %d, upstream %s:%d", LISTEN_PORT, UPSTREAM_HOST, UPSTREAM_PORT)
        async with server:
            await server.serve_forever()


    if __name__ == "__main__":
        logging.basicConfig(
            level=logging.INFO, stream=sys.stdout,
            format="%(asctime)s %(levelname)s %(message)s",
        )
        asyncio.run(main())
