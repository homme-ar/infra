# Public Newznab feed endpoint for the friend: https://nzbindex-apps.${CLUSTER_DOMAIN}
# Deliberately NOT behind Authelia — authentication is the custom API key
# enforced by the feed-proxy itself (external auth would break API clients).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nzbindex-feed
  namespace: nntp-share
  labels:
    app.kubernetes.io/name: nntp-share
    app.kubernetes.io/component: feed-proxy
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - "nzbindex-apps.${CLUSTER_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: feed-proxy
          port: 80
