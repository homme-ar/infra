apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  namespace: radarr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/href: "https://radarr-apps.${CLUSTER_DOMAIN}"
    gethomepage.dev/group: Media
    gethomepage.dev/weight: "40"
    gethomepage.dev/name: Radarr
    gethomepage.dev/icon: radarr.png
    gethomepage.dev/description: Movie manager
    gethomepage.dev/widget.type: "radarr"
    gethomepage.dev/widget.url: "http://radarr.radarr"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - "radarr-apps.${CLUSTER_DOMAIN}"
  rules:
    - filters:
        - type: ExternalAuth
          externalAuth:
            backendRef:
              group: ""
              kind: Service
              name: authelia
              namespace: authelia
              port: 80
            protocol: HTTP
            http:
              path: /api/authz/ext-authz/
              allowedHeaders:
                - cookie
                - authorization
                - x-forwarded-proto
                - x-forwarded-host
                - x-forwarded-uri
                - x-forwarded-for
                - accept
              allowedResponseHeaders:
                - remote-user
                - remote-groups
                - remote-name
                - remote-email
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: radarr
          port: 80
