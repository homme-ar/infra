apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lingarr
  namespace: lingarr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/href: "https://lingarr-apps.${CLUSTER_DOMAIN}"
    gethomepage.dev/group: Media
    gethomepage.dev/weight: "72"
    gethomepage.dev/name: Lingarr
    gethomepage.dev/icon: mdi-translate
    gethomepage.dev/description: AI subtitle translator
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - "lingarr-apps.${CLUSTER_DOMAIN}"
  rules:
    - filters:
        - type: ExternalAuth
          externalAuth:
            backendRef:
              group: ""
              kind: Service
              name: authelia
              namespace: authelia
              port: 80
            protocol: HTTP
            http:
              path: /api/authz/ext-authz/
              allowedHeaders:
                - cookie
                - authorization
                - x-forwarded-proto
                - x-forwarded-host
                - x-forwarded-uri
                - x-forwarded-for
                - accept
              allowedResponseHeaders:
                - remote-user
                - remote-groups
                - remote-name
                - remote-email
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: lingarr
          port: 80
