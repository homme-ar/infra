apiVersion: apps/v1
kind: Deployment
metadata:
  name: lingarr
  namespace: lingarr
  labels:
    app.kubernetes.io/name: lingarr
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lingarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lingarr
    spec:
      # Runs fully as UID/GID 1000 so translated .es.srt files land on the
      # QNAP NFS share with the same ownership as every other media app.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: lingarr
          image: ghcr.io/lingarr-translate/lingarr:1.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9876
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: http://+:9876
            - name: TZ
              value: America/Argentina/Buenos_Aires
            - name: DB_CONNECTION
              value: sqlite
            # Repo Services expose port 80 (targetPort = app port), so the
            # in-cluster URLs must NOT use the apps' native ports.
            - name: RADARR_URL
              value: http://radarr.radarr.svc.cluster.local
            - name: SONARR_URL
              value: http://sonarr.sonarr.svc.cluster.local
            # Local AI translation via Ollama's OpenAI-compatible chat API.
            # Lingarr treats any endpoint ending in "completions" as chat;
            # qwen2.5 follows instructions far better through its chat
            # template than through raw /api/generate completions.
            # Single value, NOT a JSON array: /api/translate/languages passes
            # this raw to the service factory, which only matches bare names.
            # NOTE: SERVICE_TYPE / LOCAL_AI_* / AI_PROMPT overwrite the
            # matching DB settings at every startup
            # (StartupService.ApplySettingsFromEnvironment) — change them
            # here, never in the Lingarr UI.
            - name: SERVICE_TYPE
              value: localai
            - name: LOCAL_AI_ENDPOINT
              value: http://ollama.ollama.svc.cluster.local:11434/v1/chat/completions
            - name: LOCAL_AI_MODEL
              value: qwen2.5:7b
            # Rioplatense prompt with few-shot examples: the examples are what
            # make qwen2.5:7b preserve <i> tags and use voseo consistently.
            # Avoid negated rules ("never use Mexican slang") — they degrade
            # small-model output. Temperature is pinned to 0.2 in the chat
            # request template (DB-only setting, see docs/AI-SUBTITLES.md).
            - name: AI_PROMPT
              value: |
                You are a subtitle translator from {sourceLanguage} to {targetLanguage} as spoken in Argentina (Rioplatense Spanish).
                Translate the subtitle line the user sends you. Rules:
                - Use Argentine voseo and natural Rioplatense phrasing, but stay strictly faithful to the original meaning.
                - Never add, omit, or invent content. Translate only the line the user sends, nothing more.
                - Keep a similar length to the original.
                - HTML tags such as <i> and </i> must be kept unchanged, wrapping the translated text in the same positions.
                - Output only the translated line.

                Examples:
                English: <i>I know, I know.</i>
                Spanish: <i>Ya sé, ya sé.</i>
                English: You are kidding me, right?
                Spanish: Me estás cargando, ¿no?
                English: Holy shit, that is my car!
                Spanish: ¡La puta madre, ese es mi auto!
            - name: SOURCE_LANGUAGES
              value: '[{"name":"English","code":"en"}]'
            - name: TARGET_LANGUAGES
              value: '[{"name":"Spanish","code":"es"}]'
            # Authelia owns authentication at the gateway.
            - name: AUTH_ENABLED
              value: "false"
            - name: TELEMETRY_ENABLED
              value: "false"
            - name: RADARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lingarr-secret
                  key: RADARR_API_KEY
            - name: SONARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lingarr-secret
                  key: SONARR_API_KEY
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: lingarr-config
        - name: data
          persistentVolumeClaim:
            claimName: nas-media
