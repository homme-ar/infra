apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/component: server
spec:
  replicas: 1
  # Recreate ensures the RWO Longhorn PVC is released before a new pod
  # attaches it, preventing multi-attach errors and SQLite corruption.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
    spec:
      # Runs on ser-msa2cp1: the nvidia.com/gpu request below pins scheduling to
      # the only GPU node. The nvidia runtime handler (Talos container-toolkit
      # extension) injects the driver libraries into the container.
      runtimeClassName: nvidia
      # LinuxServer images must start as root: their s6-overlay init applies
      # the PUID/PGID mapping and then drops to the unprivileged abc user
      # (UID/GID 1000), which is the owner used on the QNAP NFS share.
      securityContext:
        fsGroup: 1000
      containers:
        - name: jellyfin
          image: lscr.io/linuxserver/jellyfin:10.11.11
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8096
              protocol: TCP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Argentina/Buenos_Aires
            # The toolkit default capabilities (compute,utility) do not expose
            # the video engines; without "all" ffmpeg cannot see NVENC/NVDEC.
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: all
          # No capability drops here: the s6-overlay init needs CHOWN/SETUID/
          # SETGID to fix /config ownership before dropping to the abc user.
          # The app process itself ends up running unprivileged (PUID 1000).
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: 2Gi
              nvidia.com/gpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
            # Media library is read-only for Jellyfin; it never writes to
            # the QNAP share.
            - name: data
              mountPath: /data
              readOnly: true
            - name: transcode
              mountPath: /config/data/transcodes
        # Prunes Live TV guide poster caches: every daily "Refresh Guide" task
        # drops ~4k new poster.jpg dirs into /config/data/metadata/livetv and
        # Jellyfin never deletes them (~0.5 GB/day — this filled the PVC once
        # already). Entries older than the 7-day guide window are unreachable
        # from the UI, so deleting them is safe. Runs as a sidecar because the
        # RWO Longhorn PVC cannot be mounted by a separate CronJob pod.
        - name: livetv-guide-prune
          image: alpine:3.24
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              while :; do
                echo "Pruning livetv guide posters older than 7 days..."
                # rm -rf per dir, not find -delete: -delete skips dirs whose
                # contents didn't match -mtime and leaves "not empty" errors.
                find /config/data/metadata/livetv -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} +
                echo "Prune done."
                sleep 86400
              done
          volumeMounts:
            - name: config
              mountPath: /config
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: data
          persistentVolumeClaim:
            claimName: nas-media
        # Transcode scratch stays ephemeral instead of on the Longhorn PVC.
        - name: transcode
          emptyDir: {}
