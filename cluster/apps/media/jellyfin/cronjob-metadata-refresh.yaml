# Self-healing workaround for a Jellyfin 10.11.x bug: items created during a
# real *arr import often get their first refresh processed in "selective" mode
# (only local providers run), so remote metadata (TMDB/OMDb) is never fetched
# and later scans never retry. Manual/FullRefresh works fine, so this job
# periodically finds items still missing metadata and forces a FullRefresh.
#
# Runs every 4 hours. The Jellyfin API key lives in metadata-refresh-secret.yaml.
# Python image because it ships urllib+json in stdlib: nothing to install, so
# the container can stay fully non-root (apk add would need root).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jellyfin-metadata-refresh
  namespace: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/component: metadata-refresh
spec:
  schedule: "13 */4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jellyfin
            app.kubernetes.io/component: metadata-refresh
        spec:
          restartPolicy: OnFailure
          containers:
            - name: refresh
              image: python:3.13.13-alpine3.22
              imagePullPolicy: IfNotPresent
              env:
                - name: JELLYFIN_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: jellyfin-metadata-refresh
                      key: JELLYFIN_API_KEY
              command:
                - python3
                - -c
                - |
                  import json
                  import os
                  import time
                  import urllib.request

                  BASE = "http://jellyfin.jellyfin.svc.cluster.local"
                  KEY = os.environ["JELLYFIN_API_KEY"]


                  def api(path, post=False):
                      req = urllib.request.Request(
                          BASE + path,
                          method="POST" if post else "GET",
                          headers={"X-Emby-Token": KEY},
                      )
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          return None if post else json.load(resp)


                  # Root items (movies/series) without a TMDB id were never
                  # identified. Recursive so seasons/episodes inherit the fix.
                  roots = api("/Items?Recursive=true&IncludeItemTypes=Movie,Series&HasTmdbId=false&Fields=ProviderIds")["Items"]
                  for item in roots:
                      print(f"Refreshing root item {item['Id']} ({item['Name']})", flush=True)
                      api(f"/Items/{item['Id']}/Refresh?recursive=true&metadataRefreshMode=FullRefresh&imageRefreshMode=FullRefresh&replaceAllMetadata=false&replaceAllImages=false", post=True)
                      time.sleep(2)

                  # Episodes that still have no metadata at all (no provider
                  # ids, no overview). Items genuinely absent from TMDB simply
                  # come back empty again — one cheap search per run.
                  episodes = api("/Items?Recursive=true&IncludeItemTypes=Episode&HasTmdbId=false&HasTvdbId=false&Fields=ProviderIds,Overview&Limit=500")["Items"]
                  for item in episodes:
                      if item.get("Overview"):
                          continue
                      print(f"Refreshing episode {item['Id']}", flush=True)
                      api(f"/Items/{item['Id']}/Refresh?metadataRefreshMode=FullRefresh&imageRefreshMode=FullRefresh&replaceAllMetadata=false&replaceAllImages=false", post=True)
                      time.sleep(2)

                  print(f"Done. roots={len(roots)} episodes={len(episodes)}", flush=True)
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
