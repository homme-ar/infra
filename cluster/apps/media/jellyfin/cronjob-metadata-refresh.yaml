# Self-healing workaround for a Jellyfin 10.11.x bug: items created during a
# real *arr import often get their first refresh processed in "selective" mode
# (only local providers run), so remote metadata (TMDB/OMDb) is never fetched
# and later scans never retry. Manual/FullRefresh works fine, so this job
# periodically finds items still missing metadata and forces a FullRefresh.
#
# Runs every 4 hours. The Jellyfin API key lives in metadata-refresh-secret.yaml.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jellyfin-metadata-refresh
  namespace: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/component: metadata-refresh
spec:
  schedule: "13 */4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jellyfin
            app.kubernetes.io/component: metadata-refresh
        spec:
          restartPolicy: OnFailure
          containers:
            - name: refresh
              image: alpine:3.24
              imagePullPolicy: IfNotPresent
              env:
                - name: JELLYFIN_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: jellyfin-metadata-refresh
                      key: JELLYFIN_API_KEY
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  apk add --no-cache -q curl jq
                  BASE="http://jellyfin.jellyfin.svc.cluster.local"
                  AUTH="X-Emby-Token: $${JELLYFIN_API_KEY}"

                  # Root items (movies/series) without a TMDB id were never
                  # identified. Recursive so seasons/episodes inherit the fix.
                  ROOTS=$(curl -sfS -H "$${AUTH}" "$${BASE}/Items?Recursive=true&IncludeItemTypes=Movie,Series&HasTmdbId=false&Fields=ProviderIds" | jq -r '.Items[].Id')
                  for ID in $${ROOTS}; do
                    echo "Refreshing root item $${ID}"
                    curl -sfS -o /dev/null -X POST -H "$${AUTH}" "$${BASE}/Items/$${ID}/Refresh?recursive=true&metadataRefreshMode=FullRefresh&imageRefreshMode=FullRefresh&replaceAllMetadata=false&replaceAllImages=false"
                    sleep 2
                  done

                  # Episodes that still have no metadata at all (no provider
                  # ids, no overview). Items genuinely absent from TMDB simply
                  # come back empty again — one cheap search per run.
                  EPS=$(curl -sfS -H "$${AUTH}" "$${BASE}/Items?Recursive=true&IncludeItemTypes=Episode&HasTmdbId=false&HasTvdbId=false&Fields=ProviderIds,Overview&Limit=500" | jq -r '.Items[] | select((.Overview // "") | length == 0) | .Id')
                  for ID in $${EPS}; do
                    echo "Refreshing episode $${ID}"
                    curl -sfS -o /dev/null -X POST -H "$${AUTH}" "$${BASE}/Items/$${ID}/Refresh?metadataRefreshMode=FullRefresh&imageRefreshMode=FullRefresh&replaceAllMetadata=false&replaceAllImages=false"
                    sleep 2
                  done

                  echo "Done."
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
