apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Do NOT set `namespace:` here — it re-writes the metadata.namespace of the
# SOPS-encrypted Secret and corrupts its MAC, causing Flux SOPS decryption
# to fail. Every resource already declares its own namespace inline.
resources:
  - namespace.yaml
  - pvc-data.yaml
  # MIGRATION resources — remove after migration Job completes successfully
  - pv-nfs-source.yaml
  - pvc-nfs-source.yaml
  - migration-job.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
