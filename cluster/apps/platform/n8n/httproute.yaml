apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n
  namespace: n8n
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Platform
    gethomepage.dev/name: n8n
    gethomepage.dev/icon: n8n.png
    gethomepage.dev/description: Workflow automation
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: kube-system
  # Same hostname as the legacy deployment. This specific match takes
  # precedence over the legacy-fallback wildcard route at cutover time.
  hostnames:
    - "n8n-apps.${CLUSTER_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: n8n
          port: 80
