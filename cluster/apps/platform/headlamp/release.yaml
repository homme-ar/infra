apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 30m
  chart:
    spec:
      chart: headlamp
      version: "0.43.*"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1

    serviceAccount:
      create: true

    clusterRoleBinding:
      create: true
      clusterRoleName: cluster-admin

    config:
      inCluster: true
      inClusterContextName: "main"
      # UNSAFE: authenticate every Headlamp user as the pod's service account.
      # This is safe because the ingress is protected by Authelia (two_factor policy).
      # Users are never prompted for a Kubernetes token — Authelia handles authentication.
      unsafeUseServiceAccountToken: true
      # Directory where init containers deposit plugin bundles
      pluginsDir: /build/plugins
      extraArgs:
        # Enable identity-aware proxy mode so Headlamp reads user identity from
        # Authelia's response headers and bypasses the internal login screen.
        - "-proxy-auth=true"
        # Authelia injects Remote-User, Remote-Email, Remote-Groups headers
        - "-proxy-auth-username-header=Remote-User"
        - "-proxy-auth-email-header=Remote-Email"
        - "-proxy-auth-group-header=Remote-Groups"

    service:
      type: ClusterIP
      port: 80

    # Ingress and HTTPRoute managed as separate Gateway API HTTPRoute resource
    ingress:
      enabled: false
    httpRoute:
      enabled: false

    # Plugins are loaded from an emptyDir volume populated by init containers at pod start
    initContainers:
      # Flux plugin: official container image copies files from /plugins/* into the shared volume
      - name: headlamp-plugin-flux
        image: ghcr.io/headlamp-k8s/headlamp-plugin-flux:v0.6.0
        imagePullPolicy: Always
        command:
          - /bin/sh
          - -c
          - mkdir -p /build/plugins && cp -r /plugins/* /build/plugins/ && chown -R 100:101 /build
        securityContext:
          runAsNonRoot: false
          privileged: false
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
          - mountPath: /build/plugins
            name: headlamp-plugins
      # cert-manager plugin: no container image available; download release tarball instead
      - name: headlamp-plugin-cert-manager
        image: alpine:latest
        imagePullPolicy: Always
        command:
          - /bin/sh
          - -c
          - "wget -O /tmp/cert-manager.tar.gz https://github.com/headlamp-k8s/plugins/releases/download/cert-manager-0.1.1/headlamp-k8s-cert-manager-0.1.1.tar.gz && mkdir -p /build/plugins && tar -xzf /tmp/cert-manager.tar.gz -C /build/plugins/ && chown -R 100:101 /build"
        securityContext:
          runAsNonRoot: false
          privileged: false
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
          - mountPath: /build/plugins
            name: headlamp-plugins
      # Prometheus plugin: provides metrics graphs and dashboards in Headlamp.
      # Configured to point at the in-cluster kube-prometheus-stack Prometheus service.
      - name: headlamp-plugin-prometheus
        image: alpine:latest
        imagePullPolicy: Always
        command:
          - /bin/sh
          - -c
          - "wget -O /tmp/prometheus.tar.gz https://github.com/headlamp-k8s/plugins/releases/download/prometheus-0.9.0/prometheus-0.9.0.tar.gz && mkdir -p /build/plugins && tar -xzf /tmp/prometheus.tar.gz -C /build/plugins/ && chown -R 100:101 /build"
        securityContext:
          runAsNonRoot: false
          privileged: false
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
          - mountPath: /build/plugins
            name: headlamp-plugins

    volumeMounts:
      - mountPath: /build/plugins
        name: headlamp-plugins

    volumes:
      - name: headlamp-plugins
        emptyDir: {}
