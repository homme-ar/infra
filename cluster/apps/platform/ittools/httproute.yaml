apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ittools
  namespace: ittools
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: kube-system
  hostnames:
    - "ittools-apps.${CLUSTER_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ittools
          port: 80
