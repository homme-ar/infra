apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ittools
  namespace: ittools
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/href: "https://ittools-apps.${CLUSTER_DOMAIN}"
    gethomepage.dev/group: Platform
    gethomepage.dev/name: IT Tools
    gethomepage.dev/icon: it-tools.png
    gethomepage.dev/description: IT utilities collection
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: kube-system
  hostnames:
    - "ittools-apps.${CLUSTER_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ittools
          port: 80
