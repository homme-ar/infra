apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: postgres
spec:
  # PostgreSQL 18. Note: CNPG forbids in-place major version bumps — a
  # future major upgrade requires recreating the Cluster (dump/restore).
  imageName: ghcr.io/cloudnative-pg/postgresql:18

  # 2 instances: 1 primary + 1 hot standby (streaming replication)
  instances: 2

  # Superuser credentials secret (SOPS-encrypted)
  superuserSecret:
    name: postgres-superuser-secret

  # Enable superuser (postgres) access — required for external tools like DBeaver
  enableSuperuserAccess: true

  # Bootstrap an empty cluster (no pre-created databases or users beyond superuser)
  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: postgres-superuser-secret

  postgresql:
    parameters:
      # Performance tuning for NVMe storage with SPDK v2
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "1310kB"
      huge_pages: "off"
      # WAL retention: keep at least 8GB of WAL on primary so that a new
      # replica has enough time to complete pg_basebackup and catch up via
      # streaming replication even under heavy write load (e.g. logical
      # replication initial data copy). CNPG default (512MB) is too low.
      wal_keep_size: "8GB"

  # Shrunk from 500Gi to 150Gi on 2026-07-21 after DB cleanup + VACUUM FULL brought
  # the actual dataset down to ~11GB. Shrinking a CNPG Cluster in-place is not
  # supported (webhook + Kubernetes both reject PVC size reduction), so this
  # required destroy + logical restore of homeassistant/authelia DBs.
  # Bumped to 160Gi on 2026-09-07 to un-wedge postgres-2: a versitygw outage
  # blocked WAL archiving for 15 days, pg_wal filled the 150Gi PVC, and CNPG
  # refuses to start the instance until the PVC group is enlarged.
  storage:
    size: 160Gi
    storageClass: longhorn-singlenode

  # Rolling update strategy — standby updated first, then primary
  primaryUpdateStrategy: unsupervised

  # Continuous backup to the in-cluster Versity Gateway (S3 API over the QNAP
  # NFS share /backup/versitygw). Base backups are taken weekly via the
  # ScheduledBackup; WAL archiving is continuous, giving PITR to any second
  # inside the 30-day retention window.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://postgres
      endpointURL: http://versitygw.backup.svc.cluster.local:7070
      s3Credentials:
        accessKeyId:
          name: postgres-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: postgres-backup-s3
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip

  # Affinity: spread instances across different nodes for HA
  affinity:
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

  # Managed roles — CNPG creates and maintains these PostgreSQL roles declaratively
  managed:
    roles:
      - name: authelia
        ensure: present
        login: true
        passwordSecret:
          name: authelia-postgres-secret
      - name: homeassistant
        ensure: present
        login: true
        # REPLICATION lets this role create a SUBSCRIPTION during the
        # migration from the legacy bitnami PG18 without needing to fall
        # back to the superuser account. Safe to keep after the migration
        # since Home Assistant does not use it for anything else.
        replication: true
        passwordSecret:
          name: home-assistant-postgres-secret
      - name: n8n
        ensure: present
        login: true
        passwordSecret:
          name: n8n-postgres-secret
      - name: homebox
        ensure: present
        login: true
        passwordSecret:
          name: homebox-postgres-secret
