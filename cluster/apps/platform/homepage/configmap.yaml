apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  # Gateway API HTTPRoute discovery only; there are no Ingresses in this cluster
  kubernetes.yaml: |
    mode: cluster
    gateway: true
    ingress: false
  settings.yaml: |
    title: Homme
    theme: dark
    color: slate
    language: es
    logo: https://${CLUSTER_DOMAIN}/assets/logo/black.svg
    favicon: https://${CLUSTER_DOMAIN}/assets/favicon/main.png
    background:
      image: https://${CLUSTER_DOMAIN}/assets/background/main.jpg
      blur: sm
      saturate: 50
      brightness: 50
      opacity: 50
    # Providers for info widgets (widgets.yaml)
    providers:
      longhorn:
        url: http://longhorn-frontend.longhorn-system
    # Group order (usage frequency first); applies to merged static + discovered groups
    layout:
      Media:
        style: row
        columns: 4
      IoT:
        style: row
        columns: 4
      Networking:
        style: row
        columns: 3
      Security:
        style: row
        columns: 3
      Tools:
        style: row
        columns: 3
      Automation:
        style: row
        columns: 3
      Notifications:
        style: row
        columns: 3
      Observability:
        style: row
        columns: 3
      Infrastructure:
        style: row
        columns: 3
  # Static services: homelab devices and external services (the cluster
  # apps are auto-discovered from HTTPRoute annotations). Groups merge with
  # discovered groups of the same name; lower weight sorts first.
  services.yaml: |
    - Networking:
        - Unifi Controller:
            icon: unifi.png
            href: https://${UNIFI_IP}/
            description: Network controller
            weight: 10
            widget:
              type: unifi
              url: https://${UNIFI_IP}
              username: "{{HOMEPAGE_VAR_UNIFI_USERNAME}}"
              password: "{{HOMEPAGE_VAR_UNIFI_PASSWORD}}"
        - AdGuard DNS:
            icon: adguard-home.png
            href: http://${SER_DNS1_IP}/
            description: DNS server (ser-dns1)
            weight: 20
            widget:
              type: adguard
              url: http://${SER_DNS1_IP}
              username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
              password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
    - IoT:
        - SLZB-06 Coordinator:
            icon: zigbee.png
            href: http://${SLZB06_COORDINATOR_IP}/
            description: Zigbee coordinator
            weight: 40
        - SLZB-06 Router:
            icon: zigbee.png
            href: http://${SLZB06_ROUTER_IP}/
            description: Zigbee router
            weight: 50
        - OpenTherm Gateway:
            icon: mdi-thermostat
            href: http://${OPENTHERM_GW_IP}/
            description: Boiler gateway
            weight: 60
        - Solar Logger:
            icon: mdi-solar-power
            href: http://${SOLAR_LOGGER_IP}/
            description: Solar generation monitor
            weight: 70
    - Security:
        - Reolink NVR:
            icon: reolink.png
            href: http://${REOLINK_NVR_IP}/
            description: Camera NVR
            weight: 20
    - Infrastructure:
        - QNAP NAS:
            icon: qnap.png
            href: http://${NAS_IP}/cgi-bin/
            description: NAS management
            weight: 10
            widget:
              type: qnap
              url: http://${NAS_IP}
              username: "{{HOMEPAGE_VAR_QNAP_USERNAME}}"
              password: "{{HOMEPAGE_VAR_QNAP_PASSWORD}}"
    - Tools:
        - Prusa Connect:
            icon: prusa-research.png
            href: https://connect.prusa3d.com/
            description: 3D printer cloud
            weight: 30
  bookmarks.yaml: |
    - Infra:
        - GitHub Repo:
            - abbr: GH
              href: https://github.com/homme-ar/infra
  # Widgets without API keys: search + cluster summary via metrics.k8s.io
  widgets.yaml: |
    - search:
        provider: duckduckgo
        target: _blank
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "homme-cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - type: longhorn
  # No Docker host; the file must exist or homepage fails config init
  docker.yaml: ""
  # No Proxmox; the file must exist or homepage fails config init
  proxmox.yaml: ""
  custom.css: ""
  custom.js: ""
