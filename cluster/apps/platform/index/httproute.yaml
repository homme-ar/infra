apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: index
  namespace: index
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: kube-system
  hostnames:
    - "homme.ar"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: index
          port: 80
