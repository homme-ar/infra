apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: waha
  namespace: waha
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/href: "https://waha-adm.${CLUSTER_DOMAIN}"
    gethomepage.dev/group: Notifications
    gethomepage.dev/weight: "20"
    gethomepage.dev/name: WAHA
    gethomepage.dev/icon: whatsapp.png
    gethomepage.dev/description: WhatsApp HTTP API
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: kube-system
      sectionName: https
  # Same hostname as the legacy deployment. This specific match takes
  # precedence over the legacy-fallback wildcard route at cutover time.
  hostnames:
    - "waha-adm.${CLUSTER_DOMAIN}"
  rules:
    # Authelia ext-authz protects every path (dashboard, swagger and API),
    # matching the legacy authentik forwardAuth behavior. WAHA initiates
    # outbound webhooks to n8n, so no machine-to-machine inbound exception
    # is required.
    - filters:
        - type: ExternalAuth
          externalAuth:
            backendRef:
              group: ""
              kind: Service
              name: authelia
              namespace: authelia
              port: 80
            protocol: HTTP
            http:
              path: /api/authz/ext-authz/
              allowedHeaders:
                - cookie
                - authorization
                - x-forwarded-proto
                - x-forwarded-host
                - x-forwarded-uri
                - x-forwarded-for
                - accept
              allowedResponseHeaders:
                - remote-user
                - remote-groups
                - remote-name
                - remote-email
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: waha
          port: 80
