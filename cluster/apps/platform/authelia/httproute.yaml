apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
  namespace: authelia
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/href: "https://auth.${CLUSTER_DOMAIN}"
    gethomepage.dev/group: Security
    gethomepage.dev/weight: "30"
    gethomepage.dev/name: Authelia
    gethomepage.dev/icon: authelia.png
    gethomepage.dev/description: Single sign-on portal
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - "auth.${CLUSTER_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authelia
          port: 80
