apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 30m
  chart:
    spec:
      chart: authelia
      version: "0.11.6"
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    secret:
      existingSecret: authelia-secret
      # Extra SOPS-managed secret (secret-oidc.yaml) holding the OIDC provider
      # material: HMAC key, JWKS RSA private key and per-client secret digests.
      # Mounted whole at /secrets/authelia-oidc/.
      additionalSecrets:
        authelia-oidc: {}
    pod:
      kind: Deployment
      replicas: 1
      strategy:
        type: Recreate
      extraVolumes:
        - name: authelia-users
          secret:
            secretName: authelia-secret
      extraVolumeMounts:
        - name: authelia-users
          mountPath: /config/users_database.yml
          subPath: users_database.yml
          readOnly: true
    configMap:
      theme: dark
      server:
        port: 9091
        endpoints:
          authz:
            ext-authz:
              implementation: ExtAuthz
              authn_strategies:
                - name: HeaderAuthorization
                  schemes:
                    - Basic
                    - Bearer
                - name: CookieSession
      log:
        level: info
      default_2fa_method: webauthn
      identity_validation:
        elevated_session:
          # Skip email OTP challenge when already authenticated — outbound SMTP (port 465) is blocked at cluster level
          skip_second_factor: true
      authentication_backend:
        file:
          enabled: true
          path: /config/users_database.yml
      access_control:
        default_policy: two_factor
        rules:
          - domain:
              - "longhorn-adm.${CLUSTER_DOMAIN}"
              - "headlamp-adm.${CLUSTER_DOMAIN}"
            policy: two_factor
          - domain:
              - "*.${CLUSTER_DOMAIN}"
            policy: two_factor
      session:
        name: authelia_session
        cookies:
          - domain: ${CLUSTER_DOMAIN}
            subdomain: auth
            name: authelia_session
      storage:
        postgres:
          enabled: true
          address: 'tcp://postgres-rw.postgres.svc.cluster.local:5432'
          database: authelia
          schema: public
          username: authelia
          password:
            # path must match the key name in existingSecret (authelia-secret)
            path: 'storage.postgres.password'
      notifier:
        disable_startup_check: false
        smtp:
          enabled: true
          # MailerSend — STARTTLS on port 587
          address: 'submission://smtp.mailersend.net:587'
          timeout: '5 seconds'
          username: MS_7lauQs@homme.ar
          sender: '"Authelia" <mail@homme.ar>'
          identifier: auth.${CLUSTER_DOMAIN}
          subject: "[Authelia] {title}"
          startup_check_address: catrielmuller@gmail.com
          disable_require_tls: false
          disable_html_emails: true
          tls:
            server_name: smtp.mailersend.net
            skip_verify: false
            minimum_version: TLS1.2
          password:
            # path must match the key name in existingSecret (authelia-secret)
            path: 'notifier.smtp.password'
      webauthn:
        disable: false
        enable_passkey_login: true
        display_name: Homme Authelia
        attestation_conveyance_preference: indirect
        timeout: '60 seconds'
        selection_criteria:
          user_verification: preferred
      # OpenID Connect identity provider. Used by ha-mcp (cluster/apps/iot/ha-mcp)
      # as an access gate; ha-mcp handles Dynamic Client Registration for MCP
      # clients itself, so Authelia only ever sees this single static client.
      identity_providers:
        oidc:
          enabled: true
          hmac_secret:
            secret_name: authelia-oidc
            path: identity_providers.oidc.hmac.key
          jwks:
            - key_id: main
              algorithm: RS256
              use: sig
              key:
                path: /secrets/authelia-oidc/identity_providers.oidc.jwks.rs256.pem
          clients:
            - client_id: ha-mcp
              client_name: Home Assistant MCP
              # PBKDF2 digest read from the authelia-oidc secret; the plaintext
              # lives in the ha-mcp namespace secret (OIDC_CLIENT_SECRET).
              client_secret:
                path: /secrets/authelia-oidc/identity_providers.oidc.client.ha-mcp.secret
              redirect_uris:
                - https://ha-mcp.${CLUSTER_DOMAIN}/auth/callback
              scopes:
                - openid
                - profile
                - email
                - offline_access
              grant_types:
                - authorization_code
                - refresh_token
              response_types:
                - code
              authorization_policy: two_factor
              # ha-mcp (FastMCP) validates JWT access tokens by default; the
              # chart default ('none') would issue opaque tokens instead.
              access_token_signed_response_alg: RS256
    service:
      port: 80
