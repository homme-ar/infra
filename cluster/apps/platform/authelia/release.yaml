apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 30m
  chart:
    spec:
      chart: authelia
      version: "0.9.*"
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    secret:
      existingSecret: authelia-secret
    pod:
      kind: Deployment
      replicas: 1
      strategy:
        type: Recreate
      extraVolumes:
        - name: authelia-users
          secret:
            secretName: authelia-secret
      extraVolumeMounts:
        - name: authelia-users
          mountPath: /config/users_database.yml
          subPath: users_database.yml
          readOnly: true
    configMap:
      theme: dark
      server:
        host: 0.0.0.0
        port: 9091
        buffers:
          authz:
            read: 8192
            write: 8192
        endpoints:
          authz:
            ext-authz:
              implementation: ExtAuthz
              authn_strategies:
                - name: HeaderAuthorization
                  schemes:
                    - Basic
                    - Bearer
                - name: CookieSession
      log:
        level: info
      default_2fa_method: webauthn
      authentication_backend:
        file:
          enabled: true
          path: /config/users_database.yml
      access_control:
        default_policy: two_factor
        rules:
          - domain:
              - "longhorn-adm.${CLUSTER_DOMAIN}"
            policy: one_factor
          - domain:
              - "*.${CLUSTER_DOMAIN}"
            policy: two_factor
      session:
        name: authelia_session
        cookies:
          - domain: ${CLUSTER_DOMAIN}
            subdomain: auth
            authelia_url: https://auth.${CLUSTER_DOMAIN}
            name: authelia_session
      storage:
        postgres:
          address: 'tcp://postgres-rw.postgres.svc.cluster.local:5432'
          database: authelia
          schema: public
          username: authelia
          # password is read from existingSecret key: storage.postgres.password
      notifier:
        disable_startup_check: true
        smtp:
          # MailerSend — implicit TLS on port 465
          address: 'submissions://smtp.mailersend.net:465'
          timeout: 5s
          username: MS_7lauQs@homme.ar
          sender: '"Authelia" <mail@homme.ar>'
          identifier: auth.${CLUSTER_DOMAIN}
          subject: "[Authelia] {title}"
          startup_check_address: mail@homme.ar
          disable_require_tls: false
          disable_html_emails: false
          tls:
            server_name: smtp.mailersend.net
            skip_verify: false
            minimum_version: TLS1.2
      webauthn:
        disable: false
        display_name: Homme Authelia
        attestation_conveyance_preference: indirect
        timeout: 60s
        selection_criteria:
          # cross-platform covers USB/NFC/BLE hardware keys such as Trezor
          attachment: cross-platform
          discoverability: preferred
          user_verification: preferred
        metadata:
          # Disable FIDO MDS lookup — not required for hardware key registration
          enabled: false
    service:
      port: 80
