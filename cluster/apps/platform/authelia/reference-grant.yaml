apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: authelia-httproute-grant
  namespace: authelia
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: longhorn-system
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: headlamp
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: esphome
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: zigbee2mqtt
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: observability
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: waha
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: homepage
    # Media stack (sonarr/radarr/lidarr/prowlarr/bazarr/sabnzbd) — these apps
    # have their built-in auth disabled and rely on Authelia at the gateway.
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: sonarr
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: radarr
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: lidarr
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: prowlarr
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: bazarr
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: sabnzbd
  to:
    - group: ""
      kind: Service
      name: authelia
