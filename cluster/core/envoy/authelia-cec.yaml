apiVersion: cilium.io/v2
kind: CiliumClusterwideEnvoyConfig
metadata:
  name: authelia-ext-authz
spec:
  services:
    - name: envoy-gateway
      namespace: kube-system
  resources:
    - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
      name: authelia_cluster
      type: STRICT_DNS
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: authelia_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: authelia.auth.svc.cluster.local
                      port_value: 80
    - "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
      http_service:
        server_uri:
          uri: http://authelia.auth.svc.cluster.local/api/authz/ext-authz/
          cluster: authelia_cluster
          timeout: 0.25s
        authorization_request:
          allowed_headers:
            patterns:
              - exact: accept
              - exact: authorization
              - exact: cookie
              - exact: proxy-authorization
              - exact: x-forwarded-method
              - exact: x-forwarded-proto
              - exact: x-forwarded-host
              - exact: x-forwarded-uri
              - exact: x-original-url
        authorization_response:
          allowed_upstream_headers:
            patterns:
              - exact: authorization
              - prefix: remote-user
              - prefix: remote-groups
              - prefix: remote-name
              - prefix: remote-email
