apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: "1.8.*"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    defaultSettings:
      # Use /var/lib/longhorn corresponding to the SKC3000 NVMe disk mounts on all Talos nodes
      defaultDataPath: "/var/lib/longhorn"
      createDefaultDiskLabeledNodes: true
    csi:
      # Talos Linux stores kubelet state inside /var/lib/kubelet
      kubeletRootDir: "/var/lib/kubelet"
    ingress:
      # Disable embedded ingress in favor of Gateway API HTTPRoute
      enabled: false
