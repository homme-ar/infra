apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-frontend
  namespace: longhorn-system
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: kube-system
  hostnames:
    - "longhorn-adm.homme.ar"
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: ""
            kind: Service
            name: authelia
            port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: longhorn-frontend
          port: 80
