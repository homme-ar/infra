<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homme</title>
    <style>
      html,
      body {
        background-color: #181c1d;
        margin: 0;
        padding: 0;
      }
      body {
        width: 100vw;
        height: 100vh;
        background: url(/assets/background.jpg) no-repeat;
        background-position: center;
        background-size: cover;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #logo {
        width: 30%;
      }
      .cluster-badge {
        position: fixed;
        bottom: 16px;
        right: 16px;
        background: rgba(0, 0, 0, 0.6);
        color: #a0aec0;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 12px;
        font-weight: 600;
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(4px);
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <img id="logo" src="/assets/logo.svg" title="Homme" />
    <div class="cluster-badge">v2</div>
  </body>
</html>
