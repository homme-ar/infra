apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: ssh://git@github.com/homme-ar/infra.git
  ignore: |
    # exclude files not required for reconciliation
    /.git/
    /.github/
    /.vscode/
    /.idea/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster/flux-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-infrastructure
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster/infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-infrastructure-security-config
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster/infrastructure/security/cert-manager-config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cluster-infrastructure
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
# Dedicated Kustomization for the CloudNativePG operator.
# Runs after cluster-infrastructure and waits for the HelmRelease to be healthy
# before cluster-apps attempts to create any CNPG Cluster resources (requires CRDs).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-infrastructure-cnpg
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster/infrastructure/storage/cloudnativepg
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cluster-infrastructure
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cloudnative-pg
      namespace: cnpg-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
# Dedicated Kustomization for the Wireguard operator instance + peers.
# Runs after cluster-infrastructure and waits for the wireguard-operator
# HelmRelease to be healthy before applying the Wireguard/WireguardPeer CRs
# (which require CRDs installed by the Helm chart to be present first).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-infrastructure-wireguard
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster/infrastructure/networking/wireguard/instance
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cluster-infrastructure
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: wireguard-operator
      namespace: wireguard-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
# Dedicated Kustomization for kube-prometheus-stack.
# Runs after cluster-infrastructure and waits for the HelmRelease to be healthy
# before cluster-apps can rely on Prometheus Operator CRDs (ServiceMonitor,
# PodMonitor, PrometheusRule) being available cluster-wide.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-infrastructure-observability-prometheus
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster/infrastructure/observability/kube-prometheus-stack
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cluster-infrastructure
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: observability
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
# ServiceMonitors and PodMonitors for existing cluster components.
# Must run AFTER kube-prometheus-stack so that the Prometheus Operator CRDs
# (ServiceMonitor, PodMonitor) are registered before these resources are applied.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-infrastructure-observability-monitors
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster/infrastructure/observability/servicemonitors
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cluster-infrastructure-observability-prometheus
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
# PrometheusRules (alert definitions). Same ordering constraint as the
# monitors: the Prometheus Operator CRDs must exist first. Firing alerts are
# surfaced to NTFY via the "Postgres backup alerts" Gatus endpoint, which
# polls the Prometheus query API (Alertmanager has no receivers configured).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-infrastructure-observability-prometheusrules
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster/infrastructure/observability/prometheusrules
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cluster-infrastructure-observability-prometheus
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
# Alertmanager -> ntfy bridge (formats the raw webhook JSON into readable ntfy
# notifications on the private `alerts` topic). Deployed after Prometheus so
# Alertmanager exists to point at it; the webhook URL is wired in the
# kube-prometheus-stack HelmRelease values.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-infrastructure-observability-ntfy-alertmanager
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster/infrastructure/observability/ntfy-alertmanager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cluster-infrastructure-observability-prometheus
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cluster-infrastructure
    # Wait for CNPG operator to be healthy before applying Cluster resources
    - name: cluster-infrastructure-cnpg
    # Wait for Prometheus Operator CRDs to be installed before applying any
    # resources that reference ServiceMonitor, PodMonitor, PrometheusRule.
    - name: cluster-infrastructure-observability-prometheus
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
