# Cluster-wide variables for Flux post-build variable substitution.
# Add spec.postBuild.substituteFrom referencing this ConfigMap on every Kustomization
# that needs substitution. Reference variables in manifests with ${VARIABLE_NAME}.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
data:
  # ── Domain ────────────────────────────────────────────────────────────────
  CLUSTER_DOMAIN: "homme.ar"
  # Domain with dots replaced by dashes; used for resource names (e.g. TLS secret)
  CLUSTER_DOMAIN_SLUG: "homme-ar"

  # ── ACME / Let's Encrypt ───────────────────────────────────────────────────
  ACME_EMAIL: "catrielmuller@gmail.com"

  # ── Network interface (physical NIC used for L2 announcements / Cilium) ───
  NETWORK_INTERFACE: "enp5s0f0np0"

  # ── Load-balancer IP pool ─────────────────────────────────────────────────
  LB_POOL_START: "10.0.21.1"
  LB_POOL_END: "10.0.25.254"

  # ── Specific LB IPs reserved for well-known services ──────────────────────
  # Wildcard DNS answer IP (same as pool start / gateway IP)
  LB_WILDCARD_IP: "10.0.21.1"

  # ── Auxiliary NixOS hosts (Raspberry Pi 4, DHCP reservations) ─────────────
  # AdGuard Home DNS server
  SER_DNS1_IP: "10.0.10.1"
  # GPS-disciplined NTP stratum 1 server
  SER_NTP1_IP: "10.0.10.2"

  # ── OCI cloud hosts ───────────────────────────────────────────────────────
  OCI_CLOUD_IP: "129.151.125.247"

  # ── Storage ───────────────────────────────────────────────────────────────
  STORAGE_CLASS: "longhorn"
  # Single-replica StorageClass for databases (CNPG handles HA via streaming replication)
  STORAGE_CLASS_SINGLENODE: "longhorn-singlenode"

  # ── NAS (QNAP) ────────────────────────────────────────────────────────────
  # IP of the QNAP NAS exporting the media share over NFS — set before commit
  NAS_IP: "10.0.4.1"
  # NFS export path on the QNAP (single share mounted as /data in media pods)
  NAS_SHARE_PATH: "/homme"

  # ── VPN LoadBalancer IP ───────────────────────────────────────────────────
  # Dedicated LoadBalancer IP for the WireGuard VPN (managed by wireguard-operator)
  LB_VPN_IP: "10.0.21.2"

  # ── Database / Broker LoadBalancer IPs ───────────────────────────────────
  # Dedicated LoadBalancer IP for the in-cluster PostgreSQL primary (CNPG)
  LB_POSTGRES_IP: "10.0.22.1"
  # Dedicated LoadBalancer IP for the in-cluster Mosquitto MQTT broker
  LB_MQTT_IP: "10.0.22.2"
